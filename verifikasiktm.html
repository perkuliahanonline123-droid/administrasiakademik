<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi KTM Mahasiswa - STAIIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bg-stai-green { background-color: #125b39; }
        .text-stai-green { color: #125b39; }
        .bg-stai-green-light { background-color: #eef5f1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans sm:p-4">

    <!-- Container Utama -->
    <div id="card-container" class="w-full max-w-sm bg-white sm:rounded-3xl shadow-xl overflow-hidden border border-gray-200 hidden">
        
        <!-- Header - Bagian Hijau -->
        <div class="bg-stai-green p-8 flex flex-col items-center sm:rounded-t-3xl">
            <div class="w-28 h-28 bg-white rounded-xl p-1 mb-4 shadow-sm relative">
                <img id="photoUrl" src="https://via.placeholder.com/150" alt="Foto Mahasiswa" class="w-full h-full object-cover rounded-lg bg-gray-200">
            </div>
            
            <h1 id="name" class="text-white text-xl font-bold text-center">Memuat...</h1>
            <p id="angkatan" class="text-green-100 text-sm mt-1">-</p>
            
            <div class="mt-4 bg-[#19754b] text-white px-4 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#2bd47e]"></span>
                <span>Aktif</span>
            </div>
        </div>

        <!-- Body - Informasi Akademik -->
        <div class="p-6">
            <div class="flex justify-center mb-6">
                <!-- Ganti dengan URL Logo Asli -->
                <img src="https://via.placeholder.com/300x80?text=Logo+STAIIS" alt="Logo STAIIS" class="h-14 object-contain">
            </div>

            <div class="flex flex-col gap-3">
                <div class="bg-gray-50 p-4 rounded-2xl flex items-center gap-4">
                    <div class="bg-stai-green-light p-2.5 rounded-full text-stai-green"><i data-lucide="book" class="w-5 h-5"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-medium">Program Studi</p>
                        <p id="programStudi" class="text-sm font-bold text-gray-800">-</p>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-2xl flex items-center gap-4">
                    <div class="bg-stai-green-light p-2.5 rounded-full text-stai-green"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-medium">Angkatan</p>
                        <p id="tahunAngkatan" class="text-sm font-bold text-gray-800">-</p>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-2xl flex items-center gap-4">
                    <div class="bg-stai-green-light p-2.5 rounded-full text-stai-green"><i data-lucide="info" class="w-5 h-5"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-medium">Keterangan</p>
                        <p class="text-sm font-bold text-gray-800 leading-tight">Mahasiswa aktif STAI Imam Syafi'i Cianjur.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-6 pb-6 text-center">
            <p class="text-[10px] text-blue-500/80 mb-4 font-medium">www.staiimamsyafii.ac.id</p>
        </div>
    </div>

    <!-- Tampilan Error/Loading -->
    <div id="status-message" class="text-center p-8 bg-white rounded-xl shadow-md max-w-sm w-full mx-4">
        <i data-lucide="loader-2" id="loading-icon" class="animate-spin text-stai-green w-10 h-10 mx-auto mb-4"></i>
        <h2 id="status-text" class="text-lg font-bold text-gray-800">Mencari Data Mahasiswa...</h2>
    </div>

    <script>
        lucide.createIcons();
        
        // 1. Ambil NIM dari URL (Contoh: web.com/?nim=25110455)
        const urlParams = new URLSearchParams(window.location.search);
        const nimParam = urlParams.get('nim');
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbw7pgDjQaj0hpuOXYCc1JJ5KWjd8er1_rfm9yK0_WOSv51Jvdqo54mGz0WSqGT5NCh3MA/exec';

        async function initVerification() {
            if (!nimParam) {
                showError("Gagal: Barcode tidak valid atau NIM tidak ditemukan pada link.");
                return;
            }

            try {
                // Fetch seluruh data mahasiswa
                const response = await fetch(scriptUrl);
                const students = await response.json();
                
                // Cari mahasiswa berdasarkan NIM
                // Asumsi key JSON dari Google Apps Script: "nim", "namaLengkap", "programStudi", dll.
                // Jika key berbeda, sesuaikan dengan hasil output GAS Anda.
                const student = students.find(s => String(s.nim) === String(nimParam));

                if (student) {
                    // Tampilkan Data
                    document.getElementById('name').innerText = student.nama || student.namaLengkap || "Nama Kosong";
                    document.getElementById('angkatan').innerText = nimParam; // Tampilkan NIM di bawah nama
                    document.getElementById('programStudi').innerText = student.programStudi || "-";
                    document.getElementById('tahunAngkatan').innerText = student.angkatan || "-";
                    
                    if(student.foto) {
                        document.getElementById('photoUrl').src = student.foto;
                    }

                    // Sembunyikan loading, munculkan kartu
                    document.getElementById('status-message').classList.add('hidden');
                    document.getElementById('card-container').classList.remove('hidden');
                } else {
                    showError(`Data mahasiswa dengan NIM ${nimParam} tidak ditemukan.`);
                }
            } catch (error) {
                showError("Gagal terhubung ke database server.");
            }
        }

        function showError(msg) {
            document.getElementById('loading-icon').classList.replace('animate-spin', 'hidden');
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text').classList.add('text-red-500');
        }

        window.addEventListener('DOMContentLoaded', initVerification);
    </script>
</body>
</html>
