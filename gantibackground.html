<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Warna Latar Belakang</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Card Aplikasi Utama */
        .editor-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        /* Tampilan Upload (Dropzone) */
        #view-upload {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dropzone {
            width: 100%;
            height: 350px;
            border-radius: 16px;
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e6e6e6 25%, transparent 25%), 
                              linear-gradient(-45deg, #e6e6e6 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e6e6e6 75%), 
                              linear-gradient(-45deg, transparent 75%, #e6e6e6 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ccc;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .dropzone:hover {
            border-color: #5d46e2;
        }

        .btn-upload-main {
            background: #5d46e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(93, 70, 226, 0.25);
        }

        .dropzone p {
            color: #777;
            font-weight: 500;
        }

        /* Tampilan Editor */
        #view-editor {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        /* Palet Warna */
        .color-palette {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            position: relative; /* Penting untuk pop-up picker kustom */
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .color-dot:hover, .color-dot.active {
            transform: scale(1.15);
            border-color: #333;
        }

        /* Tombol Pemicu Custom Color Picker */
        .color-picker-trigger {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .color-picker-trigger:hover, .color-picker-trigger.active {
            transform: scale(1.15);
            border: 2px solid #333;
        }

        /* ==== CUSTOM COLOR PICKER POP-UP ==== */
        .custom-color-picker-popup {
            position: absolute;
            top: 40px; /* Melayang di bawah tombol palet */
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: none; /* Sembunyi secara default */
            flex-direction: column;
            gap: 12px;
            width: 250px;
            z-index: 100;
            cursor: default;
        }

        /* Kotak Utama Saturasi (Gradasi Besar) */
        .cp-saturation {
            width: 100%;
            height: 140px;
            background-color: #f00; /* Berubah mengikuti Hue */
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
        }
        .cp-sat-white {
            background: linear-gradient(to right, #fff, rgba(255,255,255,0));
            width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none;
        }
        .cp-sat-black {
            background: linear-gradient(to top, #000, rgba(0,0,0,0));
            width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none;
        }
        .cp-thumb-sat {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 100%; left: 0%; /* Default ke Hitam */
            transform: translate(-50%, -50%);
            background: #000;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* Slider Hue (Pelangi) */
        .cp-hue {
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
            position: relative;
            cursor: pointer;
        }
        .cp-thumb-hue {
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 0%;
            transform: translate(-50%, -50%);
            background: #f00;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* Input Hex */
        .cp-inputs {
            display: flex;
            gap: 8px;
        }
        .cp-inputs select {
            padding: 6px 4px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            color: #333;
        }
        .cp-inputs input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            color: #333;
            text-transform: uppercase;
        }
        /* ================================== */

        /* Area Kanvas */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #C8102E; /* Default Merah */
            border: 1px solid #eee;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Tombol Close */
        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #333;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
            z-index: 10;
        }

        .btn-close:hover {
            background: #fff;
            transform: scale(1.05);
        }

        /* Pengaturan Toleransi */
        .settings-bar {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
            background: #f4f4f7;
            padding: 10px;
            border-radius: 10px;
        }
        .settings-bar input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        /* Tombol Aksi Bawah */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #f0f0f5;
            color: #444;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #e2e2ec; }
        .btn-primary { background-color: #5d46e2; color: white; }
        .btn-primary:hover { background-color: #4b36c8; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ubah Latar Belakang</h1>
        <p>Hapus latar belakang asli dan ganti warnanya dengan mudah.</p>
    </div>

    <div class="editor-card">
        
        <!-- TAMPILAN 1: UPLOAD -->
        <div id="view-upload">
            <div class="dropzone" onclick="document.getElementById('file-input').click()">
                <button class="btn-upload-main">
                    <i class="fa-solid fa-plus"></i> Mulai dari foto
                </button>
                <p>Atau lepaskan gambar di sini</p>
            </div>
        </div>

        <!-- TAMPILAN 2: EDITOR -->
        <div id="view-editor">
            
            <!-- Palet Warna & Pemilih Kustom -->
            <div class="color-palette">
                <div class="color-dot active" style="background-color: #C8102E;" title="Merah" onclick="changeBg('#C8102E', this)"></div>
                <div class="color-dot" style="background-color: #ffffff;" title="Putih" onclick="changeBg('#ffffff', this)"></div>
                <div class="color-dot" style="background-color: #00e5ff;" title="Cyan" onclick="changeBg('#00e5ff', this)"></div>
                <div class="color-dot" style="background-color: #0038ff;" title="Biru" onclick="changeBg('#0038ff', this)"></div>
                <div class="color-dot" style="background-color: #556b2f;" title="Hijau Olive" onclick="changeBg('#556b2f', this)"></div>
                <div class="color-dot" style="background-color: #ff3385;" title="Pink" onclick="changeBg('#ff3385', this)"></div>
                <div class="color-dot" style="background-color: #ff6b6b;" title="Coral Red" onclick="changeBg('#ff6b6b', this)"></div>
                <div class="color-dot" style="background-color: #fffdd0;" title="Krem" onclick="changeBg('#fffdd0', this)"></div>
                
                <!-- Tombol Pemilih Kustom -->
                <div class="color-picker-trigger" id="customTrigger" title="Warna Lainnya" onclick="toggleCustomPicker(event)"></div>

                <!-- Custom Pop-Up Picker (seperti gambar referensi) -->
                <div class="custom-color-picker-popup" id="customPickerPopup" onclick="event.stopPropagation()">
                    <div class="cp-saturation" id="cpSaturation">
                        <div class="cp-sat-white"></div>
                        <div class="cp-sat-black"></div>
                        <div class="cp-thumb-sat" id="cpThumbSat"></div>
                    </div>
                    <div class="cp-hue" id="cpHue">
                        <div class="cp-thumb-hue" id="cpThumbHue"></div>
                    </div>
                    <div class="cp-inputs">
                        <select>
                            <option>Hex</option>
                        </select>
                        <input type="text" id="cpHexInput" value="#C8102E" maxlength="7">
                    </div>
                </div>
            </div>

            <!-- Area Gambar -->
            <div class="canvas-wrapper" id="canvas-wrapper">
                <button class="btn-close" onclick="resetToUpload()" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
                <canvas id="main-canvas"></canvas>
            </div>

            <!-- Slider Toleransi -->
            <div class="settings-bar">
                <label for="tolerance"><i class="fa-solid fa-sliders"></i> Rapikan Tepi:</label>
                <input type="range" id="tolerance" min="10" max="150" value="70" oninput="renderCanvas()">
            </div>

            <!-- Tombol Aksi Bawah -->
            <div class="controls">
                <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Ganti Foto
                </button>
                <button class="btn"><i class="fa-solid fa-scissors"></i> Potong Kustom</button>
                <button class="btn"><i class="fa-solid fa-crop-simple"></i> Ukuran</button>
                <button class="btn" onclick="downloadResult()"><i class="fa-solid fa-download"></i> Unduh</button>
            </div>
        </div>
    </div>

    <!-- Input File Tersembunyi -->
    <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">

    <script>
        const viewUpload = document.getElementById('view-upload');
        const viewEditor = document.getElementById('view-editor');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvas-wrapper');

        let currentImage = null;
        let selectedColor = '#C8102E'; // Default Merah
        let originalBgColor = null;

        /* =========================================
           LOGIKA CUSTOM COLOR PICKER
        ========================================= */
        const popup = document.getElementById('customPickerPopup');
        const trigger = document.getElementById('customTrigger');
        const cpSaturation = document.getElementById('cpSaturation');
        const cpThumbSat = document.getElementById('cpThumbSat');
        const cpHue = document.getElementById('cpHue');
        const cpThumbHue = document.getElementById('cpThumbHue');
        const cpHexInput = document.getElementById('cpHexInput');

        let hsv = { h: 349, s: 0.92, v: 0.78 }; // HSV untuk #C8102E
        let isDraggingSat = false;
        let isDraggingHue = false;

        function toggleCustomPicker(e) {
            e.stopPropagation();
            if (popup.style.display === 'flex') {
                popup.style.display = 'none';
                trigger.classList.remove('active');
            } else {
                // Hapus titik aktif palet lain
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                trigger.classList.add('active');
                popup.style.display = 'flex';
                syncPickerUI();
            }
        }

        // Tutup popup jika klik diluar
        document.addEventListener('mousedown', (e) => {
            if (popup.style.display === 'flex' && !popup.contains(e.target) && !trigger.contains(e.target)) {
                popup.style.display = 'none';
                trigger.classList.remove('active');
            }
        });

        // Event Drag Saturasi
        cpSaturation.addEventListener('mousedown', (e) => { isDraggingSat = true; updateSat(e); });
        // Event Drag Hue
        cpHue.addEventListener('mousedown', (e) => { isDraggingHue = true; updateHue(e); });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingSat) updateSat(e);
            if (isDraggingHue) updateHue(e);
        });
        document.addEventListener('mouseup', () => {
            isDraggingSat = false;
            isDraggingHue = false;
        });

        function updateSat(e) {
            const rect = cpSaturation.getBoundingClientRect();
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));

            hsv.s = x / rect.width;
            hsv.v = 1 - (y / rect.height);
            applyColorFromPicker();
        }

        function updateHue(e) {
            const rect = cpHue.getBoundingClientRect();
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));

            hsv.h = (x / rect.width) * 360;
            applyColorFromPicker();
        }

        // Input Manual Kode Hex
        cpHexInput.addEventListener('input', (e) => {
            let hex = e.target.value;
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                hsv = hexToHsv(hex);
                selectedColor = hex;
                syncPickerUI();
                renderCanvas();
            }
        });

        function applyColorFromPicker() {
            const hex = hsvToHex(hsv.h, hsv.s, hsv.v);
            selectedColor = hex;
            cpHexInput.value = hex.toUpperCase();
            syncPickerUI();
            renderCanvas();
        }

        function syncPickerUI() {
            // Posisi Thumb (tombol geser)
            cpThumbSat.style.left = `${hsv.s * 100}%`;
            cpThumbSat.style.top = `${(1 - hsv.v) * 100}%`;
            cpThumbHue.style.left = `${(hsv.h / 360) * 100}%`;

            // Warna Elemen
            const pureHue = `hsl(${hsv.h}, 100%, 50%)`;
            cpSaturation.style.backgroundColor = pureHue;
            cpThumbHue.style.backgroundColor = pureHue;
            cpThumbSat.style.backgroundColor = selectedColor;
            cpHexInput.value = selectedColor.toUpperCase();
        }

        // --- Konversi Warna Matematika ---
        function hsvToHex(h, s, v) {
            h /= 360;
            let r, g, b;
            let i = Math.floor(h * 6);
            let f = h * 6 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r=v; g=t; b=p; break;
                case 1: r=q; g=v; b=p; break;
                case 2: r=p; g=v; b=t; break;
                case 3: r=p; g=q; b=v; break;
                case 4: r=t; g=p; b=v; break;
                case 5: r=v; g=p; b=q; break;
            }
            const toHex = x => {
                const hex = Math.round(x * 255).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            };
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }

        function hexToHsv(hex) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) / 255 || 0;
            const g = parseInt(hex.substring(2, 4), 16) / 255 || 0;
            const b = parseInt(hex.substring(4, 6), 16) / 255 || 0;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0, s = (max === 0 ? 0 : d / max), v = max;
            if (max !== min) {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s, v: v };
        }
        /* ========================================= */


        // Tangani Upload File
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const pixel = tempCtx.getImageData(5, 5, 1, 1).data;
                    originalBgColor = { r: pixel[0], g: pixel[1], b: pixel[2] };

                    viewUpload.style.display = 'none';
                    viewEditor.style.display = 'flex';
                    
                    // Set Merah Default
                    changeBg('#C8102E', document.querySelectorAll('.color-dot')[0]);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Pemotongan Gambar di Kanvas
        function renderCanvas() {
            if (!currentImage || !originalBgColor) return;

            canvasWrapper.style.backgroundColor = selectedColor;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const tolerance = parseInt(document.getElementById('tolerance').value);
            const feather = 30; // Lebar kehalusan tepi

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const diff = Math.sqrt(
                    Math.pow(r - originalBgColor.r, 2) + 
                    Math.pow(g - originalBgColor.g, 2) + 
                    Math.pow(b - originalBgColor.b, 2)
                );

                if (diff < tolerance) {
                    data[i+3] = 0; 
                } else if (diff < tolerance + feather) {
                    const alpha = ((diff - tolerance) / feather) * 255;
                    if(alpha < data[i+3]) {
                        data[i+3] = alpha;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Ganti Warna Latar Dari Palet
        function changeBg(color, element) {
            selectedColor = color;
            if (element) {
                document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
                trigger.classList.remove('active');
                element.classList.add('active');
                
                // Singkronkan Custom Picker
                hsv = hexToHsv(color);
                syncPickerUI();
            }
            renderCanvas();
        }

        // Kembali ke menu upload
        function resetToUpload() {
            currentImage = null;
            document.getElementById('file-input').value = '';
            viewEditor.style.display = 'none';
            viewUpload.style.display = 'flex';
        }

        // Unduh Hasil
        function downloadResult() {
            if (!currentImage) return;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const expCtx = exportCanvas.getContext('2d');

            expCtx.fillStyle = selectedColor;
            expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            expCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = 'foto-latar-baru.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
