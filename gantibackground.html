<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Warna Latar Belakang</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Card Aplikasi Utama */
        .editor-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 650px;
            width: 100%;
        }

        /* ==== TAMPILAN 1: UPLOAD ==== */
        #view-upload {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dropzone {
            width: 100%;
            height: 350px;
            border-radius: 16px;
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e6e6e6 25%, transparent 25%), 
                              linear-gradient(-45deg, #e6e6e6 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e6e6e6 75%), 
                              linear-gradient(-45deg, transparent 75%, #e6e6e6 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ccc;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .dropzone:hover { border-color: #5d46e2; }
        .btn-upload-main {
            background: #5d46e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(93, 70, 226, 0.25);
        }

        /* ==== TAMPILAN 2: EDITOR ==== */
        #view-editor {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar: Palet Warna & Toggle Before/After */
        .editor-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Palet Warna Kiri */
        .color-palette {
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        /* CSS Active State persis Gambar 3 (Ring luar hitam, ada gap putih) */
        .color-dot.active {
            outline: 2px solid #222;
            outline-offset: 3px;
            transform: scale(1.05);
        }

        .color-picker-trigger {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .color-picker-trigger.active {
            outline: 2px solid #222;
            outline-offset: 3px;
            transform: scale(1.05);
        }

        /* Toggle Before / After Kanan */
        .view-toggles {
            display: flex;
            background: #f0f0f4;
            border-radius: 12px;
            padding: 4px;
        }
        .view-toggles button {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .view-toggles button.active {
            background: #ffffff;
            color: #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Area Kanvas & Gambar */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background-color: #f8f9fa; /* Warna area pembungkus abu-abu terang */
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            min-height: 300px;
        }

        canvas {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px; /* Radius ujung foto */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            /* Warna latar diaplikasikan DI SINI (di kanvas langsung), agar tidak melebar ke pembungkus */
        }

        /* Tombol Close silang di ujung wrapper */
        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #333;
            font-size: 1rem;
            transition: background 0.2s;
            z-index: 10;
        }
        .btn-close:hover { background: rgba(0, 0, 0, 0.1); }

        /* Pengaturan Toleransi (Rapikan Tepi) */
        .settings-bar {
            width: 100%;
            background: #f4f4f7;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #444;
        }
        .settings-bar input[type="range"] {
            flex: 1;
            max-width: 300px;
            accent-color: #0d6efd;
            cursor: pointer;
        }

        /* Tombol Aksi Bawah */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .btn {
            background-color: #f0f0f5;
            color: #444;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #e2e2ec; }
        .btn-primary { background-color: #5d46e2; color: white; }
        .btn-primary:hover { background-color: #4b36c8; }
        
        #file-input { display: none; }

        /* ==== CUSTOM COLOR PICKER POP-UP ==== */
        .custom-color-picker-popup {
            position: absolute;
            top: 45px; 
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            gap: 12px;
            width: 250px;
            z-index: 100;
            cursor: default;
        }
        .cp-saturation { width: 100%; height: 140px; position: relative; border-radius: 8px; overflow: hidden; cursor: crosshair; }
        .cp-sat-white { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none; }
        .cp-sat-black { background: linear-gradient(to top, #000, rgba(0,0,0,0)); width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none; }
        .cp-thumb-sat { width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); background: #000; box-shadow: 0 0 4px rgba(0,0,0,0.5); pointer-events: none; }
        .cp-hue { width: 100%; height: 14px; border-radius: 7px; background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); position: relative; cursor: pointer; }
        .cp-thumb-hue { width: 18px; height: 18px; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0,0,0,0.5); pointer-events: none; }
        .cp-inputs { display: flex; gap: 8px; }
        .cp-inputs select { padding: 6px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 13px; color: #333; }
        .cp-inputs input { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; color: #333; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="editor-card">
        
        <!-- TAMPILAN 1: UPLOAD -->
        <div id="view-upload">
            <div class="dropzone" onclick="document.getElementById('file-input').click()">
                <button class="btn-upload-main">
                    <i class="fa-solid fa-plus"></i> Mulai dari foto
                </button>
                <p style="color: #777; font-weight: 500;">Atau lepaskan gambar di sini</p>
            </div>
        </div>

        <!-- TAMPILAN 2: EDITOR -->
        <div id="view-editor">
            
            <!-- Top Bar: Palette & Toggles -->
            <div class="editor-top-bar">
                
                <div class="color-palette">
                    <!-- Palet disesuaikan persis Gambar 3 -->
                    <div class="color-dot" style="background-color: #e6f2ff;" title="Light Blue" onclick="changeBg('#e6f2ff', this)"></div>
                    <div class="color-dot" style="background-color: #00e5ff;" title="Cyan" onclick="changeBg('#00e5ff', this)"></div>
                    <div class="color-dot" style="background-color: #0000ff;" title="Blue" onclick="changeBg('#0000ff', this)"></div>
                    <div class="color-dot" style="background-color: #556b2f;" title="Olive Green" onclick="changeBg('#556b2f', this)"></div>
                    <div class="color-dot" style="background-color: #ff66b2;" title="Pink" onclick="changeBg('#ff66b2', this)"></div>
                    <div class="color-dot" style="background-color: #ff7f7f;" title="Coral" onclick="changeBg('#ff7f7f', this)"></div>
                    <div class="color-dot" style="background-color: #fffdd0;" title="Cream" onclick="changeBg('#fffdd0', this)"></div>
                    <div class="color-dot active" style="background-color: #c8102e;" title="Red" onclick="changeBg('#c8102e', this)"></div>
                    
                    <div class="color-picker-trigger" id="customTrigger" title="Warna Lainnya" onclick="toggleCustomPicker(event)"></div>

                    <!-- Custom Pop-Up Picker -->
                    <div class="custom-color-picker-popup" id="customPickerPopup" onclick="event.stopPropagation()">
                        <div class="cp-saturation" id="cpSaturation">
                            <div class="cp-sat-white"></div>
                            <div class="cp-sat-black"></div>
                            <div class="cp-thumb-sat" id="cpThumbSat"></div>
                        </div>
                        <div class="cp-hue" id="cpHue">
                            <div class="cp-thumb-hue" id="cpThumbHue"></div>
                        </div>
                        <div class="cp-inputs">
                            <select><option>Hex</option></select>
                            <input type="text" id="cpHexInput" value="#C8102E" maxlength="7">
                        </div>
                    </div>
                </div>

                <div class="view-toggles">
                    <button id="btn-before" onclick="setViewMode('before')">Before</button>
                    <button id="btn-after" class="active" onclick="setViewMode('after')">After</button>
                </div>
            </div>

            <!-- Area Gambar -->
            <div class="canvas-wrapper">
                <button class="btn-close" onclick="resetToUpload()" title="Tutup">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <!-- Canvas dipusatkan dan tidak melebar -->
                <canvas id="main-canvas"></canvas>
            </div>

            <!-- Slider Toleransi (Di Bawah Gambar Sesuai Referensi) -->
            <div class="settings-bar">
                <i class="fa-solid fa-sliders"></i> Rapikan Tepi:
                <input type="range" id="tolerance" min="10" max="150" value="70" oninput="handleToleranceChange()">
            </div>

            <!-- Tombol Aksi -->
            <div class="controls">
                <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-images"></i> Ganti Foto
                </button>
                <button class="btn" onclick="downloadResult()">
                    <i class="fa-solid fa-download"></i> Unduh
                </button>
            </div>
        </div>
    </div>

    <!-- Input File Tersembunyi -->
    <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">

    <script>
        const viewUpload = document.getElementById('view-upload');
        const viewEditor = document.getElementById('view-editor');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let currentImage = null;
        let selectedColor = '#C8102E'; // Default Merah
        let originalBgColor = null;
        let currentViewMode = 'after';

        /* =========================================
           LOGIKA CUSTOM COLOR PICKER (Tetap Sama)
        ========================================= */
        const popup = document.getElementById('customPickerPopup');
        const trigger = document.getElementById('customTrigger');
        const cpSaturation = document.getElementById('cpSaturation');
        const cpThumbSat = document.getElementById('cpThumbSat');
        const cpHue = document.getElementById('cpHue');
        const cpThumbHue = document.getElementById('cpThumbHue');
        const cpHexInput = document.getElementById('cpHexInput');

        let hsv = { h: 349, s: 0.92, v: 0.78 }; // #C8102E
        let isDraggingSat = false; let isDraggingHue = false;

        function toggleCustomPicker(e) {
            e.stopPropagation();
            if (popup.style.display === 'flex') {
                popup.style.display = 'none';
                trigger.classList.remove('active');
            } else {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                trigger.classList.add('active');
                popup.style.display = 'flex';
                syncPickerUI();
            }
        }
        document.addEventListener('mousedown', (e) => {
            if (popup.style.display === 'flex' && !popup.contains(e.target) && !trigger.contains(e.target)) {
                popup.style.display = 'none'; trigger.classList.remove('active');
            }
        });
        cpSaturation.addEventListener('mousedown', (e) => { isDraggingSat = true; updateSat(e); });
        cpHue.addEventListener('mousedown', (e) => { isDraggingHue = true; updateHue(e); });
        document.addEventListener('mousemove', (e) => { if (isDraggingSat) updateSat(e); if (isDraggingHue) updateHue(e); });
        document.addEventListener('mouseup', () => { isDraggingSat = false; isDraggingHue = false; });

        function updateSat(e) {
            const rect = cpSaturation.getBoundingClientRect();
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
            hsv.s = x / rect.width; hsv.v = 1 - (y / rect.height);
            applyColorFromPicker();
        }
        function updateHue(e) {
            const rect = cpHue.getBoundingClientRect();
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            hsv.h = (x / rect.width) * 360;
            applyColorFromPicker();
        }
        cpHexInput.addEventListener('input', (e) => {
            let hex = e.target.value;
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                hsv = hexToHsv(hex); selectedColor = hex; syncPickerUI(); renderCanvas();
            }
        });
        function applyColorFromPicker() {
            selectedColor = hsvToHex(hsv.h, hsv.s, hsv.v);
            cpHexInput.value = selectedColor.toUpperCase();
            syncPickerUI(); renderCanvas();
        }
        function syncPickerUI() {
            cpThumbSat.style.left = `${hsv.s * 100}%`; cpThumbSat.style.top = `${(1 - hsv.v) * 100}%`;
            cpThumbHue.style.left = `${(hsv.h / 360) * 100}%`;
            const pureHue = `hsl(${hsv.h}, 100%, 50%)`;
            cpSaturation.style.backgroundColor = pureHue; cpThumbHue.style.backgroundColor = pureHue;
            cpThumbSat.style.backgroundColor = selectedColor;
            cpHexInput.value = selectedColor.toUpperCase();
        }
        function hsvToHex(h, s, v) {
            h /= 360; let r, g, b, i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) { case 0: r=v; g=t; b=p; break; case 1: r=q; g=v; b=p; break; case 2: r=p; g=v; b=t; break; case 3: r=p; g=q; b=v; break; case 4: r=t; g=p; b=v; break; case 5: r=v; g=p; b=q; break; }
            const toHex = x => { const hex = Math.round(x * 255).toString(16); return hex.length === 1 ? '0' + hex : hex; };
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }
        function hexToHsv(hex) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) / 255 || 0, g = parseInt(hex.substring(2, 4), 16) / 255 || 0, b = parseInt(hex.substring(4, 6), 16) / 255 || 0;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0, s = (max === 0 ? 0 : d / max), v = max;
            if (max !== min) { switch (max) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; case b: h = (r - g) / d + 4; break; } h /= 6; }
            return { h: h * 360, s: s, v: v };
        }
        /* ========================================= */

        // ==== LOGIKA UPLOAD & EDITOR ====
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width; tempCanvas.height = img.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    // Ambil warna di titik (5,5) sbg patokan warna background asli
                    const pixel = tempCtx.getImageData(5, 5, 1, 1).data;
                    originalBgColor = { r: pixel[0], g: pixel[1], b: pixel[2] };

                    viewUpload.style.display = 'none';
                    viewEditor.style.display = 'flex';
                    
                    setViewMode('after'); // Auto ke mode After
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Mode Tampilan Before / After
        function setViewMode(mode) {
            currentViewMode = mode;
            document.getElementById('btn-before').classList.toggle('active', mode === 'before');
            document.getElementById('btn-after').classList.toggle('active', mode === 'after');

            if (mode === 'before') {
                // Tampilkan asli tanpa warna
                canvas.style.backgroundColor = 'transparent';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0);
            } else {
                renderCanvas();
            }
        }

        function handleToleranceChange() {
            // Pindah otomatis ke After jika user geser slider di mode Before
            if (currentViewMode === 'before') setViewMode('after');
            else renderCanvas();
        }

        // Merender Gambar dan Menghapus Background Asli
        function renderCanvas() {
            if (!currentImage || !originalBgColor || currentViewMode === 'before') return;

            // KUNCI PERBAIKAN: Berikan background color ke ELEMEN CANVAS
            // Sehingga warna TIDAK melebar melewati batas tepi gambar
            canvas.style.backgroundColor = selectedColor;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const tolerance = parseInt(document.getElementById('tolerance').value);
            const feather = 30; 

            for (let i = 0; i < data.length; i += 4) {
                const diff = Math.sqrt(
                    Math.pow(data[i] - originalBgColor.r, 2) + 
                    Math.pow(data[i+1] - originalBgColor.g, 2) + 
                    Math.pow(data[i+2] - originalBgColor.b, 2)
                );

                if (diff < tolerance) {
                    data[i+3] = 0; // Transparan penuh
                } else if (diff < tolerance + feather) {
                    const alpha = ((diff - tolerance) / feather) * 255;
                    if(alpha < data[i+3]) data[i+3] = alpha;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function changeBg(color, element) {
            selectedColor = color;
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            trigger.classList.remove('active');
            
            if (element) {
                element.classList.add('active');
                hsv = hexToHsv(color);
                syncPickerUI();
            }
            if (currentViewMode === 'before') setViewMode('after');
            else renderCanvas();
        }

        function resetToUpload() {
            currentImage = null;
            document.getElementById('file-input').value = '';
            viewEditor.style.display = 'none';
            viewUpload.style.display = 'flex';
        }

        function downloadResult() {
            if (!currentImage) return;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width; exportCanvas.height = canvas.height;
            const expCtx = exportCanvas.getContext('2d');

            // Draw warna latar ke canvas export (kalau dalam mode Before, jangan kasih warna)
            if (currentViewMode === 'after') {
                expCtx.fillStyle = selectedColor;
                expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            }
            
            expCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = currentViewMode === 'after' ? 'foto-latar-baru.png' : 'foto-asli.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
