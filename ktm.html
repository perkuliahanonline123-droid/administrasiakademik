<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cetak KTM Mahasiswa - STAIIS Cianjur</title>

  <meta name="theme-color" content="#0d7a5b">

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CropperJS CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: #333;
      min-height: 100vh;
      display: block; 
    }

    .main-content {
      max-width: 1000px; 
      margin: 0 auto;    
      padding: 40px 20px;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      flex-shrink: 0; 
      background-color: #045844;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-title-text h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 4px 0;
    }

    .header-title-text p {
      font-size: 13px;
      color: #718096;
      margin: 0;
    }

    .header-badge {
      background-color: #f0fdf4;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #045844;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #bceadd;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: #045844;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      background-color: #f8fafc;
      transition: all 0.2s;
      cursor: pointer;
    }

    input[type="file"]:focus, input[type="file"]:hover {
      outline: none;
      border-color: #0ba97b;
      background-color: #f0fdf4;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-search-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 6px; 
      border-radius: 14px; 
      border: 3px solid #f1f5f9; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
      width: 100%;
      position: relative;
      z-index: 20;
    }

    .custom-search-box:focus-within {
      border-color: #bceadd;
    }

    .search-icon-bg {
      width: 42px;
      height: 42px;
      background-color: #0ba97b; 
      border-radius: 10px; 
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .custom-search-box input[type="text"] {
      flex: 1;
      border: none !important; 
      background: transparent !important;
      padding: 4px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      width: 100%;
      outline: none !important;
      box-shadow: none !important;
    }

    .custom-search-box input[type="text"]::placeholder {
      color: #899ab0;
      font-weight: 600;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      padding: 8px 0;
      margin: 0;
      display: none; 
    }

    .autocomplete-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.2s;
    }

    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background-color: #f0fdf4; color: #045844; }

    .autocomplete-list::-webkit-scrollbar { width: 6px; }
    .autocomplete-list::-webkit-scrollbar-track { background: transparent; }
    .autocomplete-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .action-buttons {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 25px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      background-color: #045844;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      box-shadow: 0 8px 16px rgba(4, 88, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:hover { background-color: #034233; transform: translateY(-2px); }
    .btn-main:disabled { background-color: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none;}

    .btn-secondary {
      width: 100%;
      padding: 16px;
      background-color: #f0fdf4;
      color: #0ba97b;
      border: 2px solid #0ba97b;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(11, 169, 123, 0.05);
    }

    .btn-secondary:hover {
      background-color: #e6fbf0;
      color: #045844;
      border-color: #045844;
      transform: translateY(-2px);
    }

    /* --- LIVE EDITOR RESPONSIVE --- */
    #editor-wrapper {
      width: 100%;
      position: relative;
      margin-top: 25px;
      border-radius: 20px;
      border: 1px solid #dcdcdc; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: none; 
      overflow: hidden;
      background-image: url('Depan%20KTM.jpg?v=2');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    #live-foto-container {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.8); 
      border: 2px dashed #045844;
      box-sizing: border-box;
      z-index: 10;
      overflow: hidden;
    }

    #live-nama { 
      position: absolute; 
      font-weight: 700; 
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      text-transform: uppercase; 
      margin: 0; 
      color: #1a1a1a; 
      white-space: nowrap; 
    }
    
    #live-nim { 
      position: absolute; 
      font-weight: 500; 
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      margin: 0; 
      color: #333; 
      white-space: nowrap; 
    }
    
    #live-nama-arab { 
      position: absolute; 
      font-weight: bold; 
      font-family: Arial, sans-serif;
      margin: 0; 
      color: #1a1a1a; 
      white-space: nowrap; 
    }

    /* Tampilan Twibbonize: transparan, bersih, ada panduan saat disentuh */
    .cropper-view-box { outline: none !important; border-radius: inherit; }
    .cropper-point, .cropper-line, .cropper-center { display: none !important; }
    .cropper-modal { opacity: 0 !important; } 
    .cropper-bg { background: transparent !important; }

    @media (max-width: 768px) {
      .header-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
      .main-content { padding: 20px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <div class="header-bar">
      <div class="header-title">
        <div class="header-icon">
          <i class="fa-solid fa-address-card"></i>
        </div>
        <div class="header-title-text">
          <h2>Sistem Cetak KTM</h2>
          <p>Pilih data dan upload pasfoto untuk mencetak Kartu Mahasiswa secara otomatis</p>
        </div>
      </div>
      <div class="header-badge" id="realtimeClock">
        <span class="status-dot"></span> Memuat waktu...
      </div>
    </div>

    <div class="card">
      
      <div class="form-group">
        <label><i class="fa-regular fa-id-badge" style="margin-right: 6px;"></i> 1. Pilih Nama Anda:</label>
        <div class="search-wrapper">
          <div class="custom-search-box">
            <div class="search-icon-bg">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="student-search" placeholder="⏳ Sedang memuat database..." disabled autocomplete="off">
          </div>
          <ul id="custom-autocomplete-list" class="autocomplete-list"></ul>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-camera" style="margin-right: 6px;"></i> 2. Upload Pas Foto:</label>
        <input type="file" id="upload-image" accept="image/png, image/jpeg" disabled>
        <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">
          <i class="fa-solid fa-hand-pointer"></i> <b>Tips:</b> Gunakan dua jari (cubit) untuk memperbesar/memperkecil foto dan usap untuk menggeser.
        </p>
      </div>

      <div id="editor-wrapper">
        <div id="live-foto-container">
          <img id="live-foto" src="" style="display:none; max-width: 100%;">
        </div>
        <p id="live-nama"></p>
        <p id="live-nim"></p>
        <p id="live-nama-arab"></p>
      </div>

      <div id="action-buttons" class="action-buttons">
        <button id="btn-proses" class="btn-main" onclick="prosesDanCetak()">
          <i class="fa-solid fa-download"></i> Download KTM Depan
        </button>
        <a href="https://drive.google.com/uc?export=download&id=1iSGMV2_RAQ3lN7dnwnWjvCluoBdIzFin" class="btn-secondary">
          <i class="fa-solid fa-id-card"></i> Download Belakang KTM
        </a>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw7pgDjQaj0hpuOXYCc1JJ5KWjd8er1_rfm9yK0_WOSv51Jvdqo54mGz0WSqGT5NCh3MA/exec";
    
    let studentsData = [];
    let cropper;

    // Jam Real-time Header
    function updateJam() {
      try {
        const now = new Date();
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const el = document.getElementById("realtimeClock");
        if(el) {
          el.innerHTML = `<span class="status-dot"></span> ${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()} - ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} WIB`;
        }
      } catch(e){}
    }
    setInterval(updateJam, 1000);
    updateJam();

    // 1. Memuat Data
    fetch(API_URL + "?t=" + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        studentsData = data;
        let searchInput = document.getElementById("student-search");
        
        searchInput.disabled = false;
        searchInput.placeholder = "Ketik NIM atau Nama Anda...";
      })
      .catch(error => {
        alert("Gagal memuat data dari server.");
        console.error(error);
      });

    // 2. Logic Pencarian
    const searchInput = document.getElementById('student-search');
    const autocompleteList = document.getElementById('custom-autocomplete-list');

    searchInput.addEventListener('input', function() {
      let val = this.value.toLowerCase();
      autocompleteList.innerHTML = '';

      if (val.length >= 3) {
        let filteredData = studentsData.filter(s => 
          s.nim.toLowerCase().includes(val) || s.nama.toLowerCase().includes(val)
        );

        if (filteredData.length > 0) {
          filteredData.forEach(student => {
            let li = document.createElement("li");
            li.className = "autocomplete-item";
            li.innerHTML = `<i class="fa-solid fa-user text-[#a0aec0]"></i> ${student.nim} - ${student.nama}`;
            
            li.onclick = function() {
              searchInput.value = student.nim + " - " + student.nama;
              autocompleteList.style.display = "none";
              showLiveEditor(student.nim);
            };
            autocompleteList.appendChild(li);
          });
          autocompleteList.style.display = "block";
        } else {
          autocompleteList.style.display = "none";
          hideEditor();
        }
      } else {
        autocompleteList.style.display = "none";
        hideEditor();
      }
    });

    document.addEventListener('click', function(e) {
      if (e.target.id !== "student-search") {
        autocompleteList.style.display = "none";
      }
    });

    function hideEditor() {
      document.getElementById("editor-wrapper").style.display = "none";
      document.getElementById("upload-image").disabled = true;
      let actBtn = document.getElementById('action-buttons');
      if(actBtn) actBtn.style.display = "none";
    }

    // 3. Logic Editor KTM (DIHITUNG PAKAI JS AGAR AKURAT 100% DI HP)
    function resizeLiveEditor() {
      const wrapper = document.getElementById('editor-wrapper');
      if (wrapper.style.display !== 'none') {
        const targetWidth = wrapper.clientWidth;
        const scale = targetWidth / 1011; 
        
        wrapper.style.height = (638 * scale) + 'px'; 

        // Set semua ukuran dalam pixel pasti, anti-melenceng di Safari/Chrome Mobile
        const container = document.getElementById('live-foto-container');
        container.style.width = (234 * scale) + 'px';
        container.style.height = (312 * scale) + 'px';
        container.style.left = (85 * scale) + 'px';
        container.style.top = (180 * scale) + 'px';
        container.style.borderRadius = (15 * scale) + 'px';

        const nama = document.getElementById('live-nama');
        nama.style.left = (360 * scale) + 'px';
        nama.style.top = (220 * scale) + 'px';
        nama.style.fontSize = (36 * scale) + 'px';

        const nimEl = document.getElementById('live-nim');
        nimEl.style.left = (360 * scale) + 'px';
        nimEl.style.top = (315 * scale) + 'px';
        nimEl.style.fontSize = (40 * scale) + 'px';
        nimEl.style.letterSpacing = (2 * scale) + 'px';

        const arab = document.getElementById('live-nama-arab');
        arab.style.left = (360 * scale) + 'px';
        arab.style.top = (420 * scale) + 'px';
        arab.style.fontSize = (50 * scale) + 'px';

        if(cropper) {
           cropper.resize();
        }
      }
    }
    window.addEventListener('resize', resizeLiveEditor);

    function showLiveEditor(nim) {
      let wrapper = document.getElementById("editor-wrapper");
      let fileInput = document.getElementById("upload-image");
      
      let student = studentsData.find(s => s.nim === nim);
      if (!student) return;

      document.getElementById("live-nama").innerText = student.nama;
      document.getElementById("live-nim").innerText = student.nim;
      document.getElementById("live-nama-arab").innerText = student.namaArab || "";
      
      wrapper.style.display = "block";
      fileInput.disabled = false;
      
      resizeLiveEditor();
    }

    document.getElementById('upload-image').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(event) {
        let img = document.getElementById('live-foto');
        let container = document.getElementById('live-foto-container');
        
        img.onload = function() {
          container.style.border = 'none'; 
          document.getElementById('action-buttons').style.display = 'flex';

          if (cropper) cropper.destroy();
          
          cropper = new Cropper(img, {
            aspectRatio: 234 / 312, 
            viewMode: 3, // Mengunci agar foto tidak ada ruang putih kosong     
            dragMode: 'move',      
            autoCropArea: 1,       
            cropBoxMovable: false, 
            cropBoxResizable: false, 
            toggleDragModeOnDblclick: false,
            zoomable: true,
            zoomOnTouch: true,
            zoomOnWheel: true,
            guides: true, // Garis panduan 3x3 layaknya Twibbonize
            center: false,
            highlight: false,
            background: false,
            ready: function () {
              // Mengunci area potong persis seukuran bingkai (Anti-geser)
              let contData = this.cropper.getContainerData();
              this.cropper.setCropBoxData({
                left: 0,
                top: 0,
                width: contData.width,
                height: contData.height
              });
            }
          });
        };
        
        img.src = event.target.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // 4. Logic Download HTML5 Pure Canvas (AKURASI 100% DI HP TANPA HTML2CANVAS)
    function prosesDanCetak() {
      if (!cropper) return alert("Silakan upload foto terlebih dahulu.");
      
      let btn = document.getElementById('btn-proses');
      
      let searchVal = document.getElementById("student-search").value;
      let match = searchVal.match(/^(\d+)/); 
      if (!match) return alert("Data tidak valid. Silakan cari dan klik ulang nama Anda di daftar.");
      
      let nim = match[1];
      let student = studentsData.find(s => s.nim === nim);
      if (!student) return alert("Data tidak ditemukan.");
      
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
      btn.disabled = true;

      // 4A. Ambil hasil potongan pasfoto (Resolusi 2x Lipat agar jernih)
      let canvasCrop = cropper.getCroppedCanvas({ width: 468, height: 624 });
      let base64Foto = canvasCrop.toDataURL('image/jpeg', 0.92);

      // 4B. Bangun Kanvas Matematika Murni (Sangat Cepat & Tanpa Bug Mobile)
      const canvas = document.createElement('canvas');
      canvas.width = 1011 * 2; 
      canvas.height = 638 * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2); 

      const bgImg = new Image();
      bgImg.crossOrigin = "anonymous";
      bgImg.onload = function() {
          // Cetak Latar Belakang
          ctx.drawImage(bgImg, 0, 0, 1011, 638);

          // Cetak Pasfoto dengan efek Sudut Melengkung (Radius 15px)
          ctx.save();
          ctx.beginPath();
          const x = 85, y = 180, w = 234, h = 312, r = 15;
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(canvasCrop, x, y, w, h);
          ctx.restore();

          // Cetak Teks (Nama, NIM, Arab) persis posisinya
          ctx.textBaseline = "top";
          
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "700 36px 'Plus Jakarta Sans', Arial, sans-serif";
          ctx.fillText(student.nama.toUpperCase(), 360, 220 + 5); 

          ctx.fillStyle = "#333333";
          ctx.font = "500 40px 'Plus Jakarta Sans', Arial, sans-serif";
          if ('letterSpacing' in ctx) ctx.letterSpacing = "2px";
          ctx.fillText(student.nim, 360, 315 + 5);

          ctx.fillStyle = "#1a1a1a";
          ctx.font = "bold 50px Arial, sans-serif";
          ctx.fillText(student.namaArab || "", 360, 420 + 5);

          // Render & Download!
          canvas.toBlob(function(blob) {
              let url = URL.createObjectURL(blob);
              let link = document.createElement('a');
              link.download = 'KTM_Depan_' + student.nim + '.png';
              link.href = url;

              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(url);

              // Kirim foto ke Google Sheet Background
              btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Menyimpan ke server...`;
              fetch(API_URL, {
                  method: 'POST',
                  redirect: 'follow', 
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ nim: nim, image: base64Foto })
              }).then(r => r.json()).then(res => {
                  btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM Depan`;
                  btn.disabled = false;
              }).catch(e => {
                  btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM Depan`;
                  btn.disabled = false;
              });
              
          }, 'image/png');
      };
      
      bgImg.onerror = function() {
          alert("Gagal memuat template background KTM.");
          btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM Depan`;
          btn.disabled = false;
      };
      
      bgImg.src = "Depan%20KTM.jpg?v=2";
    }
  </script>
</body>
</html>
