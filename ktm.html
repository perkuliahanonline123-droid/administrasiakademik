<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cetak KTM Mahasiswa - STAIIS Cianjur</title>

  <meta name="theme-color" content="#0d7a5b">

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- TAMBAHKAN BARIS INI UNTUK FONT ARAB AMIRI -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CropperJS CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: #333;
      min-height: 100vh;
      display: block; 
    }

    .main-content {
      max-width: 1000px; 
      margin: 0 auto;    
      padding: 40px 20px;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      flex-shrink: 0; 
      background-color: #045844;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-title-text h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 4px 0;
    }

    .header-title-text p {
      font-size: 13px;
      color: #718096;
      margin: 0;
    }

    .header-badge {
      background-color: #f0fdf4;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #045844;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #bceadd;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: #045844;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      background-color: #f8fafc;
      transition: all 0.2s;
      cursor: pointer;
    }

    input[type="file"]:focus, input[type="file"]:hover {
      outline: none;
      border-color: #0ba97b;
      background-color: #f0fdf4;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-search-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 6px; 
      border-radius: 14px; 
      border: 3px solid #f1f5f9; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
      width: 100%;
      position: relative;
      z-index: 20;
    }

    .custom-search-box:focus-within {
      border-color: #bceadd;
    }

    .search-icon-bg {
      width: 42px;
      height: 42px;
      background-color: #0ba97b; 
      border-radius: 10px; 
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .custom-search-box input[type="text"] {
      flex: 1;
      border: none !important; 
      background: transparent !important;
      padding: 4px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      width: 100%;
      outline: none !important;
      box-shadow: none !important;
    }

    .custom-search-box input[type="text"]::placeholder {
      color: #899ab0;
      font-weight: 600;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      padding: 8px 0;
      margin: 0;
      display: none; 
    }

    .autocomplete-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.2s;
    }

    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background-color: #f0fdf4; color: #045844; }

    .autocomplete-list::-webkit-scrollbar { width: 6px; }
    .autocomplete-list::-webkit-scrollbar-track { background: transparent; }
    .autocomplete-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .action-buttons {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 25px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      background-color: #045844;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      box-shadow: 0 8px 16px rgba(4, 88, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:hover { background-color: #034233; transform: translateY(-2px); }
    .btn-main:disabled { background-color: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none;}

    .btn-secondary {
      width: 100%;
      padding: 16px;
      background-color: #f0fdf4;
      color: #0ba97b;
      border: 2px solid #0ba97b;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(11, 169, 123, 0.05);
    }

    .btn-secondary:hover {
      background-color: #e6fbf0;
      color: #045844;
      border-color: #045844;
      transform: translateY(-2px);
    }

    /* --- SOLUSI LIVE EDITOR RESPONSIVE AKURAT 100% --- */
    #editor-outer-wrapper {
      width: 100%;
      position: relative;
      margin-top: 25px;
      display: none;
    }

    #editor-wrapper {
      width: 1011px;
      height: 638px;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 35px; /* Pojok tumpul KTM yang ditegaskan */
      border: 1px solid #dcdcdc; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      background-image: url('Depan%20KTM.jpg?v=2');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: top left; 
    }

    #live-foto-container {
      position: absolute;
      left: 85px; 
      top: 180px; 
      width: 234px; 
      height: 312px; 
      border-radius: 15px; 
      background-color: rgba(255, 255, 255, 0.8); 
      border: 2px dashed #045844;
      box-sizing: border-box;
      z-index: 10;
      overflow: hidden;
    }

    #live-nama { 
      position: absolute; 
      left: 360px; 
      width: 610px; 
      font-size: 36px; 
      font-weight: 700; 
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      text-transform: uppercase; 
      margin: 0; 
      color: #1a1a1a; 
      white-space: normal; 
      line-height: 45px; 
      
      /* Biarkan properti tumpuan ini dikontrol sepenuhnya oleh JavaScript nanti */
      bottom: 358px; 
      top: auto;
    }
    
    #live-nim { 
      position: absolute; 
      left: 360px; 
      bottom: 253px; /* Posisi NIM dipatok tetap di tengah yang ideal */
      top: auto !important; 
      font-size: 40px; 
      font-weight: 500; 
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      margin: 0; 
      color: #333; 
      white-space: nowrap; 
      letter-spacing: 2px;
    }
    
    #live-nama-arab { 
      position: absolute; 
      left: 360px; 
      bottom: 148px; 
      top: auto !important; 
      width: 380px; 
      font-size: 50px; 
      font-weight: bold; 
      font-family: 'Amiri', serif;
      margin: 0; 
      color: #1a1a1a; 
      white-space: normal; 
      line-height: 60px; 
    }
    
    /* Tampilan Twibbonize */
    .cropper-view-box { outline: none !important; border-radius: inherit; }
    .cropper-point, .cropper-line, .cropper-center { display: none !important; }
    .cropper-modal { opacity: 0 !important; } 
    .cropper-bg { background: transparent !important; }

    @media (max-width: 768px) {
      .header-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
      .main-content { padding: 20px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <div class="header-bar">
      <div class="header-title">
        <div class="header-icon">
          <i class="fa-solid fa-address-card"></i>
        </div>
        <div class="header-title-text">
          <h2>KTM Mahasiswa STAIIS</h2>
          <p>Gunakan PC atau laptop untuk mendapatkan hasil terbaik.</p>
        </div>
      </div>
      <div class="header-badge" id="realtimeClock">
        <span class="status-dot"></span> Memuat waktu...
      </div>
    </div>

    <div class="card">
      
      <div class="form-group">
        <label><i class="fa-regular fa-id-badge" style="margin-right: 6px;"></i> 1. Pilih Nama Anda:</label>
        <div class="search-wrapper">
          <div class="custom-search-box">
            <div class="search-icon-bg">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="student-search" placeholder="⏳ Mohon tunggu sebentar..." disabled autocomplete="off">
          </div>
          <ul id="custom-autocomplete-list" class="autocomplete-list"></ul>
        </div>
      </div>

      <div class="form-group">
          <label><i class="fa-solid fa-camera" style="margin-right: 6px; color: #15803d;"></i> 2. Upload Pasfoto:</label>
          
          <!-- Keterangan badge dirapatkan dan diminimalisir -->
          <div class="photo-requirement-badge" style="background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; display: inline-flex; align-items: center; margin-top: 0px; margin-bottom: 10px; letter-spacing: 0.5px;">
              <i class="fa-solid fa-circle-info" style="margin-right: 6px; font-size: 12px;"></i> 
              foto resmi (3&times;4) background merah
          </div>
          
          <input type="file" id="upload-image" accept="image/png, image/jpeg" disabled>
          
          <p style="font-size: 12px; color: #718096; margin-top: 8px; line-height: 1.5;">
              <i class="fa-solid fa-hand-pointer" style="margin-right: 4px; color: #16a34a;"></i> <b>Tips:</b> Gunakan dua jari (cubit) untuk memperbesar/memperkecil foto dan usap untuk menggeser posisinya.
          </p>
      </div>

      <div id="editor-outer-wrapper">
        <div id="editor-wrapper">
          <div id="live-foto-container">
            <!-- MURNI object-position: bottom TANPA RUMUS ZOOM EKSTREM AGAR PAS DI DOWNLOAD -->
            <img id="live-foto" src="fotobanat.png?v=2" style="width: 100%; height: 100%; object-fit: cover; object-position: bottom; display: block;">
          </div>
          <p id="live-nama"></p>
          <p id="live-nim"></p>
          <p id="live-nama-arab"></p>
          
          <!-- Tambahan Elemen Live QR Code -->
          <img id="live-qr" src="" alt="QR Code" style="display: none; position: absolute; left: 790px; top: 380px; width: 170px; height: 170px; z-index: 10; mix-blend-mode: multiply;">
        </div>
      </div>

      <div id="action-buttons" class="action-buttons">
        <button id="btn-proses" class="btn-main" onclick="prosesDanCetak()">
          <i class="fa-solid fa-download"></i> Download KTM
        </button>
        <a href="https://drive.google.com/uc?export=download&id=1c_MNQu3F6XODRd_w-ZJXZzRf4ErCKHJz" class="btn-secondary">
          <i class="fa-solid fa-id-card"></i> Download Belakang KTM
        </a>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw7pgDjQaj0hpuOXYCc1JJ5KWjd8er1_rfm9yK0_WOSv51Jvdqo54mGz0WSqGT5NCh3MA/exec";
    
    let studentsData = [];
    let cropper;

    function updateJam() {
      try {
        const now = new Date();
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const el = document.getElementById("realtimeClock");
        if(el) {
          el.innerHTML = `<span class="status-dot"></span> ${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()} - ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} WIB`;
        }
      } catch(e){}
    }
    setInterval(updateJam, 1000);
    updateJam();

    fetch(API_URL + "?t=" + new Date().getTime())
      .then(response => {
        // Cek apakah status HTTP-nya sukses (200-299)
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        studentsData = data;
        let searchInput = document.getElementById("student-search");
        
        searchInput.disabled = false;
        searchInput.placeholder = "Ketik NIM atau Nama Anda...";
      })
      .catch(error => {
        alert("Gagal memuat data dari server. Silakan cek URL atau koneksi.");
        console.error("Detail error:", error);
      });

    const searchInput = document.getElementById('student-search');
    const autocompleteList = document.getElementById('custom-autocomplete-list');

    searchInput.addEventListener('input', function() {
      let val = this.value.toLowerCase();
      autocompleteList.innerHTML = '';

      if (val.length >= 3) {
        let filteredData = studentsData.filter(s => 
          s.nim.toLowerCase().includes(val) || s.nama.toLowerCase().includes(val)
        );

        if (filteredData.length > 0) {
          filteredData.forEach(student => {
            let li = document.createElement("li");
            li.className = "autocomplete-item";
            li.innerHTML = `<i class="fa-solid fa-user text-[#a0aec0]"></i> ${student.nim} - ${student.nama}`;
            
            li.onclick = function() {
              searchInput.value = student.nim + " - " + student.nama;
              autocompleteList.style.display = "none";
              showLiveEditor(student.nim);
            };
            autocompleteList.appendChild(li);
          });
          autocompleteList.style.display = "block";
        } else {
          autocompleteList.style.display = "none";
          hideEditor();
        }
      } else {
        autocompleteList.style.display = "none";
        hideEditor();
      }
    });

    document.addEventListener('click', function(e) {
      if (e.target.id !== "student-search") {
        autocompleteList.style.display = "none";
      }
    });

    function hideEditor() {
      document.getElementById("editor-outer-wrapper").style.display = "none";
      document.getElementById("upload-image").disabled = true;
      let actBtn = document.getElementById('action-buttons');
      if(actBtn) actBtn.style.display = "none";
    }

    function resizeLiveEditor() {
      const outerWrapper = document.getElementById('editor-outer-wrapper');
      const innerWrapper = document.getElementById('editor-wrapper');
      
      if (outerWrapper.style.display !== 'none') {
        const targetWidth = outerWrapper.clientWidth;
        const scale = targetWidth / 1011; 
        
        innerWrapper.style.transform = `scale(${scale})`;
        outerWrapper.style.height = (638 * scale) + 'px'; 
      }
    }
    
    let lastWindowWidth = window.innerWidth;
    window.addEventListener('resize', function() {
      if (window.innerWidth !== lastWindowWidth) {
        lastWindowWidth = window.innerWidth;
        resizeLiveEditor();
      }
    });

    function showLiveEditor(nim) {
      let outerWrapper = document.getElementById("editor-outer-wrapper");
      let fileInput = document.getElementById("upload-image");
      
      let student = studentsData.find(s => s.nim === nim);
      if (!student) return;

      document.getElementById("live-nama").innerText = student.nama;
      document.getElementById("live-nim").innerText = student.nim;
      document.getElementById("live-nama-arab").innerText = student.namaArab || "";
      
      // === TAMBAHAN UNTUK MUNCULKAN QR DI PRATINJAU ===
      const verifikasiUrl = `https://administrasiakademik.vercel.app/verifikasiktm.html?nim=${student.nim}`;
      
      // Ubah size di URL menjadi 220x220
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=${encodeURIComponent(verifikasiUrl)}`;
      
      let liveQr = document.getElementById("live-qr");
      liveQr.src = qrApiUrl;
      
      // Sesuaikan left, top, width, dan height agar sama dengan settingan Canvas
      liveQr.style.left = "740px";  // <--- UBAH DARI 750px MENJADI 710px
      liveQr.style.top = "345px";
      liveQr.style.width = "220px";
      liveQr.style.height = "220px";
      
      liveQr.style.display = "block"; 
      // ===============================================

      // ... (kode di atasnya tetap) ...
      outerWrapper.style.display = "block";
      fileInput.disabled = false;
      document.getElementById('action-buttons').style.display = 'flex';
      
      // === LOGIKA PRATINJAU: NIM DIGESER JIKA ARAB 2 BARIS, NAMA LATIN DIAM DI TEMPAT ===
      setTimeout(() => {
          let arabEl = document.getElementById("live-nama-arab");
          let nimEl = document.getElementById("live-nim");
          let namaEl = document.getElementById("live-nama");

          // Arab tetap di posisinya
          arabEl.style.bottom = "148px";
          
          // Posisi Nama Latin dikunci statis di bottom 358px agar tidak nabrak logo
          namaEl.style.bottom = "358px";

          let shiftUp = 0;
          if (arabEl.offsetHeight > 70) {
              shiftUp = arabEl.offsetHeight - 60; 
          }

          // Hanya NIM yang bergeser menyesuaikan teks Arab
          nimEl.style.bottom = (253 + shiftUp) + "px";
      }, 50); 
      // ====================================================================
      
      // --- LOGIKA CERDAS PENGATUR POSISI PREVIEW ---
      setTimeout(function() {
          let arabEl = document.getElementById("live-nama-arab");
          let nimEl = document.getElementById("live-nim");
          let namaEl = document.getElementById("live-nama");

          // Reset CSS Nama Latin untuk mengukur jumlah baris murni
          namaEl.style.top = "auto";
          namaEl.style.bottom = "358px"; 
          
          // 1. Logika Nama Latin (1 Baris Statis, 2 Baris Sejajar Foto)
          if (namaEl.offsetHeight > 50) { 
              // Jika terdeteksi menjadi 2 baris
              namaEl.style.bottom = "auto";
              namaEl.style.top = "180px"; // Kunci tepat sejajar bingkai atas foto
          } else {
              // Jika tetap 1 baris
              namaEl.style.bottom = "358px"; // Posisikan kembali seperti Gambar 2
              namaEl.style.top = "auto";
          }

          // 2. Logika NIM & Nama Arab (Tetap Aman)
          arabEl.style.bottom = "148px"; 
          
          let shiftUp = 0;
          if (arabEl.offsetHeight > 70) { 
              shiftUp = arabEl.offsetHeight - 60; 
          }
          // NIM menyesuaikan teks Arab (Nama Latin di atasnya dibiarkan aman)
          nimEl.style.bottom = (253 + shiftUp) + "px";

      }, 50);
      // -----------------------------------------------------------
      resizeLiveEditor();
    }
    
    document.getElementById('upload-image').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(event) {
        let img = document.getElementById('live-foto');
        let container = document.getElementById('live-foto-container');
        
        img.onload = function() {
          container.style.border = 'none'; 

          setTimeout(function() {
            if (cropper) cropper.destroy();
            
            img.removeAttribute('style');
            img.style.display = 'block';
            img.style.width = '100%';
            img.style.maxWidth = '100%';
            img.style.height = 'auto';

            cropper = new Cropper(img, {
              aspectRatio: 234 / 312, 
              viewMode: 0, 
              dragMode: 'move',      
              autoCropArea: 1,       
              cropBoxMovable: false, 
              cropBoxResizable: false, 
              toggleDragModeOnDblclick: false,
              zoomable: true,
              zoomOnTouch: true,
              zoomOnWheel: true,
              guides: true, 
              center: false,
              highlight: false,
              background: false,
              responsive: false, 
              ready: function () {
                let contData = this.cropper.getContainerData();
                this.cropper.setCropBoxData({ left: 0, top: 0, width: contData.width, height: contData.height });
                
                let imgData = this.cropper.getImageData();
                let minZoom = Math.max(contData.width / imgData.naturalWidth, contData.height / imgData.naturalHeight);
                
                this.cropper.zoomTo(minZoom);
                this.cropper.moveTo(
                  (contData.width - (imgData.naturalWidth * minZoom)) / 2, 
                  (contData.height - (imgData.naturalHeight * minZoom)) / 2
                );
              }
            });
          }, 150);
        };
        
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 4. Logic Download PURE HTML5 CANVAS (AKURASI DIJAMIN 100%)
    function prosesDanCetak() {
      let btn = document.getElementById('btn-proses');
      let searchVal = document.getElementById("student-search").value;
      
      if (!searchVal.includes(" - ")) {
          return alert("Data tidak valid. Silakan cari dan klik ulang nama Anda di daftar.");
      }
      let nim = searchVal.split(" - ")[0].trim();
      
      let student = studentsData.find(s => s.nim === nim);
      if (!student) return alert("Data tidak ditemukan.");
      
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
      btn.disabled = true;

      let canvasCrop = null;
      let base64Foto = "";
      if (cropper) {
          canvasCrop = cropper.getCroppedCanvas({ width: 468, height: 624 });
          base64Foto = canvasCrop.toDataURL('image/jpeg', 0.92);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 1011 * 2; 
      canvas.height = 638 * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2); 

      const bgImg = new Image();
      bgImg.crossOrigin = "anonymous";
      bgImg.onload = function() {
          
          ctx.save();
          ctx.beginPath();
          const rKtm = 35;
          ctx.moveTo(rKtm, 0);
          ctx.lineTo(1011 - rKtm, 0);
          ctx.quadraticCurveTo(1011, 0, 1011, rKtm);
          ctx.lineTo(1011, 638 - rKtm);
          ctx.quadraticCurveTo(1011, 638, 1011 - rKtm, 638);
          ctx.lineTo(rKtm, 638);
          ctx.quadraticCurveTo(0, 638, 0, 638 - rKtm);
          ctx.lineTo(0, rKtm);
          ctx.quadraticCurveTo(0, 0, rKtm, 0);
          ctx.closePath();
          ctx.clip();
          
          ctx.drawImage(bgImg, 0, 0, 1011, 638);
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          const x = 85, y = 180, w = 234, h = 312, r = 15;
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.clip();
          
          if (canvasCrop) {
              ctx.drawImage(canvasCrop, x, y, w, h);
          } else {
              const defaultImg = document.getElementById('live-foto');
              const iw = defaultImg.naturalWidth || defaultImg.width;
              const ih = defaultImg.naturalHeight || defaultImg.height;
              
              // Rumus Skala Akurat: Cover proporsi lalu tempel rapat bawah tanpa tambahan angka ajaib
              const scale = Math.max(w / iw, h / ih); 
              const nw = iw * scale;
              const nh = ih * scale;
              const nx = x + (w - nw) / 2; // Rata horizontal tengah
              const ny = y + (h - nh);     // Rata mentok ke batas bawah
              
              ctx.drawImage(defaultImg, nx, ny, nw, nh);
          }
          ctx.restore();

          // --- FUNGSI BANTUAN NAMA LATIN (1 Baris = Statis, 2 Baris = Rata Atas) ---
          function cetakNamaLatin(context, text, x, maxWidth, lineHeight) {
              if (!text) return;
              var words = text.split(' ');
              var lines = [];
              var currentLine = '';
              for(var n = 0; n < words.length; n++) {
                  var testLine = currentLine + words[n] + ' ';
                  var metrics = context.measureText(testLine);
                  if (metrics.width > maxWidth && n > 0) {
                      lines.push(currentLine.trim());
                      currentLine = words[n] + ' ';
                  } else {
                      currentLine = testLine;
                  }
              }
              lines.push(currentLine.trim());

              context.textBaseline = "top"; 
              if (lines.length > 1) {
                  // 2 Baris: Mulai di koordinat Y=180 (Sejajar presisi batas atas bingkai foto)
                  var currentY = 180;
                  for(var i=0; i<lines.length; i++) {
                      context.fillText(lines[i], x, currentY);
                      currentY += lineHeight;
                  }
              } else {
                  // 1 Baris: Jatuh di koordinat Y=235 (Kalkulasi persis sejajar bottom: 358px)
                  context.fillText(lines[0], x, 235);
              }
          }

          // --- FUNGSI BANTUAN TEKS ARAB (Dari Bawah ke Atas) ---
          function cetakArabBottomUp(context, text, x, bottomY, maxWidth, lineHeight) {
              if (!text) return 0;
              var words = text.split(' ');
              var lines = [];
              var currentLine = '';
              for(var n = 0; n < words.length; n++) {
                  var testLine = currentLine + words[n] + ' ';
                  var metrics = context.measureText(testLine);
                  if (metrics.width > maxWidth && n > 0) {
                      lines.push(currentLine.trim());
                      currentLine = words[n] + ' ';
                  } else {
                      currentLine = testLine;
                  }
              }
              lines.push(currentLine.trim());
              
              var currentY = bottomY;
              context.textBaseline = "bottom";
              for(var i = lines.length - 1; i >= 0; i--) {
                  context.fillText(lines[i], x, currentY);
                  currentY -= lineHeight;
              }
              // Mengembalikan tinggi ekstra jika terjadi penambahan baris
              return (lines.length > 1) ? (lines.length - 1) * lineHeight : 0;
          }
          // -----------------------------------------------------------
          
          // 1. CETAK NAMA ARAB 
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "bold 50px 'Amiri', serif";
          if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
          ctx.direction = "rtl"; 
          ctx.textAlign = "right";
          ctx.direction = "ltr";
          ctx.textAlign = "left";
          // Cetak sekalian ambil nilai shift-nya jika nama arab 2 baris
          let shiftNimUp = cetakArabBottomUp(ctx, student.namaArab || "", 360, 490, 380, 60);

          // 2. CETAK NIM
          ctx.fillStyle = "#333333";
          ctx.font = "500 40px 'Plus Jakarta Sans', Arial, sans-serif";
          ctx.textBaseline = "bottom";
          if ('letterSpacing' in ctx) ctx.letterSpacing = "2px";
          // Posisikan NIM secara otomatis naik hanya jika Nama Arab 2 baris
          ctx.fillText(student.nim, 360, 385 - shiftNimUp);

          // 3. CETAK NAMA LATIN 
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "700 36px 'Plus Jakarta Sans', Arial, sans-serif";
          if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
          // Gunakan fungsi pintar: 1 baris diam layaknya Gambar 2, jika 2 baris kunci ke atas bingkai foto
          cetakNamaLatin(ctx, student.nama.toUpperCase(), 360, 610, 45); 

          // === MULAI TAMBAHAN GENERATE QR CODE OTOMATIS ===
          // (Lanjutkan dengan kode QR Anda ke bawah tanpa ada perubahan)

          // (Lanjutkan ke kode === MULAI TAMBAHAN GENERATE QR CODE OTOMATIS === milik Anda)
        
          // === MULAI TAMBAHAN GENERATE QR CODE OTOMATIS ===
          // URL DIPERBAIKI mengarah ke verifikasiktm.html (bukan index.html)
          const verifikasiUrl = `https://administrasiakademik.vercel.app/verifikasiktm.html?nim=${student.nim}`;
          
          // Size URL QR disamakan dengan ukuran Canvas yaitu 220x220
          const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=${encodeURIComponent(verifikasiUrl)}`;

          const qrImg = new Image();
          qrImg.crossOrigin = "anonymous";
          qrImg.onload = function() {
              
              // --- SAMAKAN ANGKA DENGAN SETTINGAN PRATINJAU LAYAR ---
              const qrX = 740;    // Sesuaikan dengan left
              const qrY = 345;    // Sesuaikan dengan top
              const qrSize = 220; // Sesuaikan dengan width/height
              // ------------------------------------------------------
              
              ctx.save();
              ctx.globalCompositeOperation = "multiply";
              ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
              ctx.restore();

              // Eksekusi download (Pindahkan canvas.toBlob ke DALAM onload QR ini)
              canvas.toBlob(function(blob) {
                  let url = URL.createObjectURL(blob);
                  let link = document.createElement('a');
                  link.download = 'KTM_' + student.nim + '.png';
                  link.href = url;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(url);

                  btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Menyimpan ke server...`;
                  let payload = { nim: nim, image: base64Foto || "" };
                  
                  fetch(API_URL, {
                      method: 'POST',
                      redirect: 'follow', 
                      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                      body: JSON.stringify(payload)
                  }).then(r => r.json()).then(res => {
                      btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM`;
                      btn.disabled = false;
                  }).catch(e => {
                      btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM`;
                      btn.disabled = false;
                  });
              }, 'image/png');
          };
          
          qrImg.onerror = function() {
              alert("Gagal memuat QR Code.");
              btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM`;
              btn.disabled = false;
          };
          qrImg.src = qrApiUrl; // Mulai memuat QR
          
      }; // Tutup fungsi bgImg.onload
      
      bgImg.onerror = function() {
          alert("Gagal memuat template background KTM.");
          btn.innerHTML = `<i class="fa-solid fa-download"></i> Download KTM`;
          btn.disabled = false;
      };
      
      bgImg.src = "Depan%20KTM.jpg?v=2";
    }
  </script>
