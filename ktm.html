<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cetak KTM Mahasiswa - STAIIS Cianjur</title>

  <meta name="theme-color" content="#0d7a5b">

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CropperJS CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <!-- html2canvas JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: #333;
      min-height: 100vh;
      display: block; 
    }

    /* --- MAIN CONTENT LAYOUT (CENTERED) --- */
    .main-content {
      max-width: 1000px; 
      margin: 0 auto;    
      padding: 40px 20px;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      min-width: 48px; /* Kunci ukuran agar tidak mengecil */
      min-height: 48px; /* Kunci ukuran agar tidak mengecil */
      flex-shrink: 0; /* Mencegah ikon menjadi lonjong di HP */
      background-color: #045844;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-title-text h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 4px 0;
    }

    .header-title-text p {
      font-size: 13px;
      color: #718096;
      margin: 0;
    }

    .header-badge {
      background-color: #f0fdf4;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #045844;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #bceadd;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    /* --- CARD CONTAINER --- */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: #045844;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      background-color: #f8fafc;
      transition: all 0.2s;
      cursor: pointer;
    }

    input[type="file"]:focus, input[type="file"]:hover {
      outline: none;
      border-color: #0ba97b;
      background-color: #f0fdf4;
    }

    /* --- STYLE PENCARIAN PINTAR (KOTAK SUDUT TUMPUL) --- */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-search-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 6px; 
      border-radius: 14px; 
      border: 3px solid #f1f5f9; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
      width: 100%;
      position: relative;
      z-index: 20;
    }

    .custom-search-box:focus-within {
      border-color: #bceadd;
    }

    .search-icon-bg {
      width: 42px;
      height: 42px;
      background-color: #0ba97b; 
      border-radius: 10px; 
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .custom-search-box input[type="text"] {
      flex: 1;
      border: none !important; 
      background: transparent !important;
      padding: 4px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      width: 100%;
      outline: none !important;
      box-shadow: none !important;
    }

    .custom-search-box input[type="text"]::placeholder {
      color: #899ab0;
      font-weight: 600;
    }

    /* TAMPILAN DROPDOWN CUSTOM */
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      padding: 8px 0;
      margin: 0;
      display: none; 
    }

    .autocomplete-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.2s;
    }

    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background-color: #f0fdf4; color: #045844; }

    .autocomplete-list::-webkit-scrollbar { width: 6px; }
    .autocomplete-list::-webkit-scrollbar-track { background: transparent; }
    .autocomplete-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .autocomplete-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* --- TOMBOL --- */
    .btn-main {
      width: 100%;
      padding: 16px;
      background-color: #045844;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: background-color 0.2s;
      box-shadow: 0 8px 16px rgba(4, 88, 68, 0.2);
    }

    .btn-main:hover { background-color: #034233; }
    .btn-main:disabled { background-color: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    .zoom-controls {
      margin-top: 15px;
      display: none;
      text-align: center;
      background: #f0fdf4;
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed #045844;
    }

    .btn-zoom {
      background-color: #ffffff;
      color: #045844;
      border: 1px solid #045844;
      padding: 8px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 0 4px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-zoom:hover { background-color: #045844; color: #ffffff; }

    /* --- LIVE EDITOR RESPONSIVE --- */
    #editor-wrapper {
      width: 100%;
      position: relative;
      margin-top: 25px;
      border-radius: 20px;
      border: 1px solid #dcdcdc; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: none; 
      overflow: hidden;
      background-image: url('Depan%20KTM.jpg?v=2');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      --scale: 1; 
    }

    #live-foto-container {
      position: absolute;
      left: calc(85px * var(--scale)); 
      top: calc(180px * var(--scale)); 
      width: calc(234px * var(--scale)); 
      height: calc(312px * var(--scale)); 
      border-radius: calc(15px * var(--scale)); 
      background-color: rgba(255, 255, 255, 0.5); 
      border: 2px dashed #045844;
      box-sizing: border-box;
      z-index: 10;
      overflow: hidden; /* Mencegah foto bleber / tumpah keluar dari bingkai di HP */
    }

    #live-nama { 
      position: absolute; 
      left: calc(360px * var(--scale)); 
      top: calc(220px * var(--scale)); 
      font-size: calc(36px * var(--scale)); 
      font-weight: 700; 
      font-family: Arial, sans-serif !important; 
      text-transform: uppercase; 
      margin: 0; 
      color: #1a1a1a; 
      white-space: nowrap; 
    }
    
    #live-nim { 
      position: absolute; 
      left: calc(360px * var(--scale)); 
      top: calc(315px * var(--scale)); 
      font-size: calc(40px * var(--scale)); 
      font-weight: 500; 
      font-family: Arial, sans-serif !important; 
      margin: 0; 
      color: #333; 
      white-space: nowrap; 
      letter-spacing: 2px;
    }
    
    #live-nama-arab { 
      position: absolute; 
      left: calc(360px * var(--scale)); 
      top: calc(420px * var(--scale)); 
      font-size: calc(50px * var(--scale)); 
      font-weight: bold; 
      font-family: Arial, sans-serif !important; 
      margin: 0; 
      color: #1a1a1a; 
      white-space: nowrap; 
    }

    .cropper-view-box { outline: none !important; border-radius: calc(15px * var(--scale)); }
    .cropper-dashed, .cropper-point, .cropper-line, .cropper-center { display: none !important; }
    .cropper-modal { opacity: 0 !important; } 
    .cropper-bg { background: transparent !important; }

    /* --- TEMPAT RENDER PNG TRANSPARAN --- */
    #export-wrapper {
      position: fixed;
      top: 0; 
      left: 0;
      opacity: 0;
      pointer-events: none; 
      z-index: -9999;
    }

    #export-ktm {
      width: 1011px;
      height: 638px;
      position: relative;
      background-color: transparent;
      border-radius: 25px;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    #export-bg { position: absolute; top: 0; left: 0; width: 1011px; height: 638px; z-index: 0; }
    #export-foto { position: absolute; left: 85px; top: 180px; width: 234px; height: 312px; object-fit: cover; border-radius: 15px; z-index: 1;}
    #export-nama { position: absolute; left: 360px; top: 220px; font-size: 36px; font-weight: 700; font-family: Arial, sans-serif !important; text-transform: uppercase; margin: 0; color: #1a1a1a; white-space: nowrap; z-index: 1;}
    #export-nim { position: absolute; left: 360px; top: 315px; font-size: 40px; font-weight: 500; font-family: Arial, sans-serif !important; margin: 0; color: #333; white-space: nowrap; letter-spacing: 2px; z-index: 1;}
    #export-nama-arab { position: absolute; left: 360px; top: 420px; font-size: 50px; font-weight: bold; font-family: Arial, sans-serif !important; margin: 0; color: #1a1a1a; white-space: nowrap; z-index: 1;}

    @media (max-width: 768px) {
      .header-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
      .main-content { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <div class="header-bar">
      <div class="header-title">
        <div class="header-icon">
          <i class="fa-solid fa-address-card"></i>
        </div>
        <div class="header-title-text">
          <h2>KTM Mahasiswa STAIIS</h2>
          <p>Pilih data dan upload pasfoto untuk mencetak Kartu Mahasiswa secara otomatis</p>
        </div>
      </div>
      <div class="header-badge" id="realtimeClock">
        <span class="status-dot"></span> Memuat waktu...
      </div>
    </div>

    <!-- MAIN FORM CARD -->
    <div class="card">
      
      <!-- PENCARIAN PINTAR CUSTOM -->
      <div class="form-group">
        <label><i class="fa-regular fa-id-badge" style="margin-right: 6px;"></i> 1. Pilih Nama Anda:</label>
        <div class="search-wrapper">
          <div class="custom-search-box">
            <div class="search-icon-bg">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="student-search" placeholder="⏳ Mohon tunggu sebentar..." disabled autocomplete="off">
          </div>
          <ul id="custom-autocomplete-list" class="autocomplete-list"></ul>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-camera" style="margin-right: 6px;"></i> 2. Upload Pas Foto:</label>
        <input type="file" id="upload-image" accept="image/png, image/jpeg" disabled>
        <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">*Foto akan otomatis masuk ke dalam bingkai editor KTM.</p>
      </div>

      <div class="zoom-controls" id="zoom-panel">
        <span style="font-size:14px; display:block; margin-bottom:8px; color:#555;">Sesuaikan Posisi Foto:</span>
        <button type="button" class="btn-zoom" onclick="zoomIn()">+ Perbesar</button>
        <button type="button" class="btn-zoom" onclick="zoomOut()">- Perkecil</button>
      </div>

      <div id="editor-wrapper">
        <div id="live-foto-container">
          <img id="live-foto" src="" style="display:none; max-width: 100%;">
        </div>
        <p id="live-nama"></p>
        <p id="live-nim"></p>
        <p id="live-nama-arab"></p>
      </div>

      <button id="btn-proses" class="btn-main" style="display:none; margin-top: 25px;" onclick="prosesDanCetak()">Download KTM</button>
    </div>
  </main>

  <!-- RENDER PNG EXPORT -->
  <div id="export-wrapper">
    <div id="export-ktm">
      <img id="export-bg" src="Depan%20KTM.jpg?v=2" alt="Background"> 
      <img id="export-foto" src="" alt="Foto">
      <p id="export-nama"></p>
      <p id="export-nim"></p>
      <p id="export-nama-arab"></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw7pgDjQaj0hpuOXYCc1JJ5KWjd8er1_rfm9yK0_WOSv51Jvdqo54mGz0WSqGT5NCh3MA/exec";
    
    let studentsData = [];
    let cropper;

    // Jam Real-time Header
    function updateJam() {
      try {
        const now = new Date();
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const el = document.getElementById("realtimeClock");
        if(el) {
          el.innerHTML = `<span class="status-dot"></span> ${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()} - ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} WIB`;
        }
      } catch(e){}
    }
    setInterval(updateJam, 1000);
    updateJam();

    // 1. Memuat Data dari API
    fetch(API_URL + "?t=" + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        studentsData = data;
        let searchInput = document.getElementById("student-search");
        
        searchInput.disabled = false;
        searchInput.placeholder = "Ketik NIM atau Nama Anda...";
      })
      .catch(error => {
        alert("Gagal memuat data dari server.");
        console.error(error);
      });

    // 2. Logic Pencarian Pintar (Custom Autocomplete)
    const searchInput = document.getElementById('student-search');
    const autocompleteList = document.getElementById('custom-autocomplete-list');

    searchInput.addEventListener('input', function() {
      let val = this.value.toLowerCase();
      autocompleteList.innerHTML = '';

      if (val.length >= 3) {
        let filteredData = studentsData.filter(s => 
          s.nim.toLowerCase().includes(val) || s.nama.toLowerCase().includes(val)
        );

        if (filteredData.length > 0) {
          filteredData.forEach(student => {
            let li = document.createElement("li");
            li.className = "autocomplete-item";
            li.innerHTML = `<i class="fa-solid fa-user text-[#a0aec0]"></i> ${student.nim} - ${student.nama}`;
            
            li.onclick = function() {
              searchInput.value = student.nim + " - " + student.nama;
              autocompleteList.style.display = "none";
              showLiveEditor(student.nim);
            };
            autocompleteList.appendChild(li);
          });
          autocompleteList.style.display = "block";
        } else {
          autocompleteList.style.display = "none";
          hideEditor();
        }
      } else {
        autocompleteList.style.display = "none";
        hideEditor();
      }
    });

    document.addEventListener('click', function(e) {
      if (e.target.id !== "student-search") {
        autocompleteList.style.display = "none";
      }
    });

    function hideEditor() {
      document.getElementById("editor-wrapper").style.display = "none";
      document.getElementById("upload-image").disabled = true;
      document.getElementById('zoom-panel').style.display = "none";
    }

    // 3. Logic Editor KTM
    function resizeLiveEditor() {
      const wrapper = document.getElementById('editor-wrapper');
      if (wrapper.style.display !== 'none') {
        const targetWidth = wrapper.clientWidth;
        const scale = targetWidth / 1011; 
        wrapper.style.setProperty('--scale', scale);
        wrapper.style.height = (638 * scale) + 'px'; 
      }
    }
    window.addEventListener('resize', resizeLiveEditor);

    function showLiveEditor(nim) {
      let wrapper = document.getElementById("editor-wrapper");
      let fileInput = document.getElementById("upload-image");
      
      let student = studentsData.find(s => s.nim === nim);
      if (!student) return;

      document.getElementById("live-nama").innerText = student.nama;
      document.getElementById("live-nim").innerText = student.nim;
      document.getElementById("live-nama-arab").innerText = student.namaArab || "";
      
      wrapper.style.display = "block";
      fileInput.disabled = false;
      
      resizeLiveEditor();
    }

    function zoomIn() { if(cropper) cropper.zoom(0.1); }
    function zoomOut() { if(cropper) cropper.zoom(-0.1); }

    document.getElementById('upload-image').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(event) {
        let img = document.getElementById('live-foto');
        let container = document.getElementById('live-foto-container');
        
        img.src = event.target.result;
        img.style.display = 'block';
        container.style.border = 'none'; 
        
        document.getElementById('btn-proses').style.display = 'block';
        document.getElementById('zoom-panel').style.display = 'block'; 

        if (cropper) cropper.destroy();
        
        cropper = new Cropper(img, {
          aspectRatio: 234 / 312, 
          viewMode: 1,           
          dragMode: 'move',      
          autoCropArea: 1,       
          cropBoxMovable: false, 
          cropBoxResizable: false, 
          toggleDragModeOnDblclick: false,
          zoomable: true
        });
      };
      reader.readAsDataURL(file);
    });

    // 4. Logic Download PNG
    function prosesDanCetak() {
      if (!cropper) return alert("Silakan upload foto terlebih dahulu.");
      
      let btn = document.getElementById('btn-proses');
      
      let searchVal = document.getElementById("student-search").value;
      let nim = searchVal.match(/^(\d+)\s-/)[1];
      let student = studentsData.find(s => s.nim === nim);
      
      btn.innerText = "⏳ Sedang memproses Gambar... (Mohon tunggu)";
      btn.disabled = true;

      let canvasCrop = cropper.getCroppedCanvas({ width: 468, height: 624 });
      let base64Foto = canvasCrop.toDataURL('image/jpeg', 0.9);

      document.getElementById('export-foto').src = base64Foto;
      document.getElementById('export-nama').innerText = student.nama;
      document.getElementById('export-nim').innerText = student.nim;
      document.getElementById('export-nama-arab').innerText = student.namaArab || "";

      let element = document.getElementById('export-ktm');
      
      html2canvas(element, {
        scale: 2, 
        useCORS: true, 
        logging: false,
        backgroundColor: null
      }).then(canvasFinal => {
        let imgData = canvasFinal.toDataURL('image/png');
        let link = document.createElement('a');
        link.download = 'KTM_' + student.nim + '.png';
        link.href = imgData;
        link.click();

        btn.innerText = "☁️ Menyimpan data foto ke server...";
        
        fetch(API_URL, {
          method: 'POST',
          redirect: 'follow', 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            nim: nim,
            image: base64Foto
          })
        })
        .then(response => response.json())
        .then(result => {
          if(result.status === "success") {
            btn.innerText = "✅ Selesai! Gambar Berhasil Diunduh";
            setTimeout(() => {
              btn.innerText = "Simpan Foto & Download PNG";
              btn.disabled = false;
            }, 3000);
          } else {
            alert("Gambar berhasil diunduh, namun foto gagal tersimpan: " + result.message);
            btn.innerText = "Simpan Foto & Download PNG";
            btn.disabled = false;
          }
        })
        .catch(error => {
          alert("Jaringan terputus saat menghubungi server.");
          btn.innerText = "Simpan Foto & Download PNG";
          btn.disabled = false;
          console.error(error);
        });
      });
    }
  </script>
</body>
</html>
