<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak KTM Mahasiswa</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f7f6;}
    .container { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; font-size: 14px; color: #555; }
    select, input[type="file"], button { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { background-color: #008080; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s;}
    button:hover { background-color: #005959; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #image-container { max-width: 100%; max-height: 400px; margin-top: 15px; display: none; }
    
    /* Tampilan Preview Layar */
    #preview-data { background: #eef2f5; padding: 15px; margin-top: 10px; border-left: 4px solid #008080; display: none; border-radius: 4px; line-height: 1.6;}
    #lbl-nama { font-weight: bold; font-size: 18px; color: #222;}
    #lbl-nim { font-size: 16px; color: #444;}
    #lbl-nama-arab { font-size: 22px; font-weight: bold; color: #222; margin-top: 5px;}
    
    /* Area Cetak KTM */
    #print-area { display: none; }
    
    /* --- PENGATURAN KHUSUS SAAT MENCETAK --- */
    @media print {
      @page { 
        size: A4 landscape; /* Memaksa mode lanskap pada ukuran kertas A4 */
        margin: 0; 
      }
      
      body { 
        background: white; 
        margin: 0; 
        padding: 0;
        /* Memosisikan kartu tepat di tengah kertas cetak */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      #app-container { display: none !important; }
      
      #print-area { 
        display: block !important; 
        position: relative; 
        width: 1011px; /* Ukuran pasti kartu */
        height: 638px; /* Ukuran pasti kartu */
        /* Background dipindah ke CSS agar presisi 100% tanpa celah putih */
        background-image: url('Depan%20KTM.jpg');
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }
      
      /* Posisi Foto */
      #print-foto { 
        position: absolute; 
        left: 85px; 
        top: 172px; 
        width: 228px; 
        height: 312px; 
        object-fit: cover; 
        border-radius: 20px; /* Sudut lengkung persis desain asli */
      }
      
      /* Posisi Teks Dirapikan */
      #print-nama { 
        position: absolute; 
        left: 360px; 
        top: 255px; 
        font-size: 38px; 
        font-weight: 600; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        text-transform: uppercase; 
        margin: 0; 
        color: #111;
        letter-spacing: 1px;
      }
      
      #print-nim { 
        position: absolute; 
        left: 360px; 
        top: 360px; 
        font-size: 42px; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        margin: 0; 
        color: #111;
        letter-spacing: 2px;
      }
      
      #print-nama-arab { 
        position: absolute; 
        left: 360px; 
        top: 475px; 
        font-size: 50px; /* Ukuran diperbesar */
        font-weight: bold; 
        font-family: 'Arial', sans-serif; 
        margin: 0; 
        color: #111; 
      }
      
      /* Posisi QR Code Dirapikan */
      #print-qr { 
        position: absolute; 
        right: 85px; 
        bottom: 85px; 
        width: 160px; 
        height: 160px; 
      }
    }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    <h2>Sistem Upload & Cetak KTM</h2>
    
    <div class="form-group">
      <label>Pilih Nama Anda:</label>
      <select id="student-select" onchange="showDetails()">
        <option value="">🔄 Memuat data dari server...</option>
      </select>
    </div>

    <!-- Tampilan Preview di Layar -->
    <div id="preview-data">
      <div id="lbl-nama"></div>
      <div id="lbl-nim"></div>
      <div id="lbl-nama-arab"></div>
    </div>

    <div class="form-group" style="margin-top: 20px;">
      <label>Upload Pas Foto (Otomatis menyesuaikan bingkai):</label>
      <input type="file" id="upload-image" accept="image/png, image/jpeg" disabled>
    </div>

    <div>
      <img id="image-container" src="">
    </div>

    <button id="btn-proses" style="display:none; margin-top: 20px;" onclick="prosesDanCetak()">Simpan Foto & Cetak KTM</button>
  </div>

  <!-- Area Cetak Khusus Print (Layered Position) -->
  <div id="print-area">
    <!-- Gambar Background sekarang dikontrol via CSS di atas -->
    <img id="print-foto" src="" alt="Foto">
    <p id="print-nama"></p>
    <p id="print-nim"></p>
    <p id="print-nama-arab"></p>
    <img id="print-qr" src="" alt="QR Code">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    // URL API APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbw7pgDjQaj0hpuOXYCc1JJ5KWjd8er1_rfm9yK0_WOSv51Jvdqo54mGz0WSqGT5NCh3MA/exec";
    
    let studentsData = [];
    let cropper;

    // Fetch JSON dari Apps Script (menggunakan anti-cache parameter ?t=)
    fetch(API_URL + "?t=" + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        studentsData = data;
        let select = document.getElementById("student-select");
        select.innerHTML = '<option value="">-- Ketik / Pilih Nama Anda --</option>';
        
        data.forEach(student => {
          let option = document.createElement("option");
          option.value = student.nim;
          option.text = student.nim + " - " + student.nama;
          select.appendChild(option);
        });
      })
      .catch(error => {
        alert("Gagal memuat data dari server.");
        console.error(error);
      });

    // Menampilkan Info Mahasiswa di layar
    function showDetails() {
      let nim = document.getElementById("student-select").value;
      let preview = document.getElementById("preview-data");
      let fileInput = document.getElementById("upload-image");
      
      if (!nim) {
        preview.style.display = "none";
        fileInput.disabled = true;
        return;
      }

      let student = studentsData.find(s => s.nim === nim);
      document.getElementById("lbl-nama").innerText = student.nama;
      document.getElementById("lbl-nim").innerText = student.nim;
      document.getElementById("lbl-nama-arab").innerText = student.namaArab || "-";
      
      preview.style.display = "block";
      fileInput.disabled = false;
    }

    // Setup Cropper
    document.getElementById('upload-image').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(event) {
        let img = document.getElementById('image-container');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('btn-proses').style.display = 'block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(img, {
          aspectRatio: 228 / 312, // Rasio foto disesuaikan
          viewMode: 1,
          dragMode: 'move'
        });
      };
      reader.readAsDataURL(file);
    });

    // Proses Upload dan Print
    function prosesDanCetak() {
      if (!cropper) return alert("Silakan upload foto.");
      
      let btn = document.getElementById('btn-proses');
      let nim = document.getElementById("student-select").value;
      let student = studentsData.find(s => s.nim === nim);
      
      btn.innerText = "⏳ Menyimpan ke server... (Mohon tunggu)";
      btn.disabled = true;

      // Render image hasil crop
      let canvas = cropper.getCroppedCanvas({ width: 456, height: 624 });
      let base64Data = canvas.toDataURL('image/png');

      // Masukkan data ke area print
      document.getElementById('print-foto').src = base64Data;
      document.getElementById('print-nama').innerText = student.nama;
      document.getElementById('print-nim').innerText = student.nim;
      document.getElementById('print-nama-arab').innerText = student.namaArab || "";
      
      // Generate QR Code dinamis 
      document.getElementById('print-qr').src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + student.nim;

      // Kirim data ke Apps Script via POST
      fetch(API_URL, {
        method: 'POST',
        redirect: 'follow', 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          nim: nim,
          image: base64Data
        })
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === "success") {
          window.print(); // Buka dialog print jika berhasil disimpan
        } else {
          alert("Gagal menyimpan foto: " + result.message);
        }
      })
      .catch(error => {
        alert("Terjadi kesalahan jaringan.");
        console.error(error);
      })
      .finally(() => {
        btn.innerText = "Simpan Foto & Cetak KTM";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
