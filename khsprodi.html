<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak KHS & Transkrip Mahasiswa</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        input[type="text"] { padding: 10px; width: 45%; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background-color: white; cursor: pointer; }
        button { padding: 10px 20px; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
        button:hover { background: #3498db; }
        #status-msg { text-align: center; margin-bottom: 20px; font-weight: bold; color: #e67e22; padding: 15px; border-radius: 5px; line-height: 1.5; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background-color: #ecf0f1; font-weight: bold; text-align: center; }
        .khs-header { margin-top: 30px; margin-bottom: 15px; display: none; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; }
        .khs-header table { width: 100%; border: none; margin: 0; font-size: 15px; }
        .khs-header table td { border: none; padding: 4px; }
        .print-btn { display: none; margin-top: 20px; width: 100%; background-color: #27ae60; }
        .print-btn:hover { background-color: #2ecc71; }
        
        .error { background-color: #fdeaea; color: #e74c3c !important; border: 1px solid #e74c3c; text-align: justify; }
        .success { color: #27ae60 !important; }
        
        @media print {
            body { background: #fff; padding: 0; }
            .search-box, .print-btn, h1, #status-msg { display: none; }
            .container { box-shadow: none; padding: 0; margin: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistem Cetak KHS & Transkrip Prodi</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ketik Nama Mahasiswa (contoh: Moh Asror)" onkeypress="handleEnter(event)">
        
        <select id="jenisCetak">
            <option value="all">Transkrip Nilai</option>
            <option value="1">KHS Semester 1</option>
            <option value="2">KHS Semester 2</option>
            <option value="3">KHS Semester 3</option>
            <option value="4">KHS Semester 4</option>
            <option value="5">KHS Semester 5</option>
            <option value="6">KHS Semester 6</option>
            <option value="7">KHS Semester 7</option>
            <option value="8">KHS Semester 8</option>
        </select>

        <button onclick="cariKHS()">Cari Data</button>
    </div>
    
    <div id="status-msg">Memeriksa koneksi database...</div>

    <div class="khs-header" id="khsHeader">
        <h2 id="judulDokumen" style="text-align: center; text-decoration: underline; margin-bottom: 20px;">KARTU HASIL STUDI (KHS)</h2>
        <table>
            <tr>
                <td style="width: 150px; font-weight: bold;">Nama Mahasiswa</td>
                <td style="width: 10px;">:</td>
                <td id="lblNama"></td>
                
                <td style="width: 150px; font-weight: bold;">Tahun Akademik</td>
                <td style="width: 10px;">:</td>
                <td id="lblTA"></td>
            </tr>
            <tr>
                <td style="font-weight: bold;">Program Studi</td>
                <td>:</td>
                <td id="lblProdi"></td>
                
                <td style="font-weight: bold;">Semester Dicetak</td>
                <td>:</td>
                <td id="lblSemester"></td>
            </tr>
        </table>
    </div>

    <table id="khsTable" style="display: none;">
        <thead>
            <tr>
                <th style="width: 5%;">No</th>
                <th style="width: 45%;">Mata Kuliah</th>
                <th style="width: 10%;">SKS</th>
                <th style="width: 15%;">Nilai Angka</th>
                <th style="width: 10%;">Huruf</th>
                <th style="width: 15%;">Mutu</th>
            </tr>
        </thead>
        <tbody id="khsBody"></tbody>
        <tfoot>
            <tr style="background-color: #f9f9f9; font-weight: bold;">
                <td colspan="2" style="text-align: right;">Total SKS & Total Mutu</td>
                <td id="totSks" style="text-align: center;">0</td>
                <td></td>
                <td></td>
                <td id="totMutu" style="text-align: center;">0.00</td>
            </tr>
            <tr style="background-color: #ecf0f1; font-weight: bold; font-size: 16px;">
                <td colspan="5" style="text-align: right;" id="lblIndeks">INDEKS PRESTASI SEMESTER (IPS)</td>
                <td id="ips" style="text-align: center; color: #2980b9;">0.00</td>
            </tr>
        </tfoot>
    </table>

    <button class="print-btn" id="printBtn" onclick="window.print()">🖨️ Cetak Dokumen (PDF / Printer)</button>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxlS2O6Z0hEzUCYVnIyuZHg-v_bV12pRKF2mG-ujQE1TDEJeSmph5mnCqIX6bAS7rls0Q/exec'; 

    const CACHE_KEY = 'KHS_PRODI_CACHE';
    const CACHE_EXPIRY = 60 * 60 * 1000; 
    let globalData = null;

    function normalizeMK(text) {
        if (!text) return "";
        return text.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function isColumnExcluded(colName) {
        const norm = colName.toString().toLowerCase().replace(/\s+/g, '');
        if (norm.includes('semester')) return true; 
        const excludeList = ['ta', 'namamahasiswa', 'ppl', 'kkn', 'skripsi'];
        return excludeList.includes(norm);
    }

    function konversiNilai(nilai) {
        let huruf = 'E', bobot = 0;
        if (nilai >= 85) { huruf = 'A'; bobot = 4.0; }
        else if (nilai >= 75) { huruf = 'B'; bobot = 3.0; }
        else if (nilai >= 60) { huruf = 'C'; bobot = 2.0; }
        else if (nilai >= 50) { huruf = 'D'; bobot = 1.0; }
        return { huruf, bobot };
    }

    function handleEnter(e) {
        if (e.key === 'Enter') cariKHS();
    }

    function setStatus(msg, type = 'normal') {
        const statusEl = document.getElementById('status-msg');
        statusEl.innerText = msg;
        statusEl.className = type;
        if(msg === "") {
            statusEl.style.display = "none";
        } else {
            statusEl.style.display = "block";
        }
    }

    async function initData() {
        if (!SCRIPT_URL) return false;

        const cachedItem = localStorage.getItem(CACHE_KEY);
        if (cachedItem) {
            const parsedCache = JSON.parse(cachedItem);
            if (Date.now() - parsedCache.timestamp < CACHE_EXPIRY) {
                globalData = parsedCache.data;
                setStatus("✅ Data siap (Menggunakan Cache Lokal)", "success");
                setTimeout(() => setStatus(""), 3000);
                return true;
            }
        }

        setStatus("⏳ Sedang mengunduh database dari Spreadsheet... Mohon tunggu.");
        
        try {
            const response = await fetch(SCRIPT_URL);
            if (!response.ok) throw new Error("Gagal terhubung ke server");
            
            const json = await response.json();
            if (json.status !== "success" || !json.data) throw new Error("Format data tidak valid.");

            globalData = json.data;
            localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: globalData }));
            
            setStatus("✅ Database berhasil dimuat!", "success");
            setTimeout(() => setStatus(""), 3000);
            return true;
        } catch (error) {
            setStatus("❌ Error: " + error.message, "error");
            return false;
        }
    }

    async function cariKHS() {
        const namaInput = document.getElementById('searchInput').value.trim().toLowerCase();
        const jenisCetak = document.getElementById('jenisCetak').value;

        if (!namaInput) return alert('Silakan masukkan nama mahasiswa terlebih dahulu!');

        if (!globalData) {
            const isReady = await initData();
            if (!isReady) return;
        }
        
        let dataASH = [], dataPBA = [], dataKurikulum = [], dataGagal = []; 
        
        for (const sheetName in globalData) {
            const nameUpper = sheetName.toUpperCase();
            if (nameUpper.includes('ASH')) dataASH = globalData[sheetName];
            if (nameUpper.includes('PBA')) dataPBA = globalData[sheetName];
            if (nameUpper.includes('KURIKULUM')) dataKurikulum = globalData[sheetName];
            if (nameUpper.includes('GAGAL')) dataGagal = globalData[sheetName]; 
        }

        // Cek Status Gagal
        const mhsGagal = dataGagal.find(row => 
            row['Mahasiswa yang GAGAL'] && 
            row['Mahasiswa yang GAGAL'].toString().toLowerCase().includes(namaInput)
        );

        if (mhsGagal) {
            let mkYangGagal = [];
            for (const key in mhsGagal) {
                if (key.includes('Mata Kuliah') && mhsGagal[key] && mhsGagal[key].toString().trim() !== '') {
                    mkYangGagal.push(mhsGagal[key].toString().trim());
                }
            }
            let teksMkGagal = mkYangGagal.length > 0 ? mkYangGagal.join(', ') : 'beberapa mata kuliah';
            setStatus(`❌ AKSES DITOLAK: Mahasiswa atas nama '${mhsGagal['Mahasiswa yang GAGAL']}' belum dapat mencetak dokumen karena terdapat mata kuliah yang belum lulus, yaitu: ${teksMkGagal}. Dokumen dapat dicetak setelah seluruh mata kuliah dinyatakan lulus.`, "error");
            document.getElementById('khsHeader').style.display = 'none';
            document.getElementById('khsTable').style.display = 'none';
            document.getElementById('printBtn').style.display = 'none';
            return; 
        }

        const semuaNilai = [...dataASH, ...dataPBA];
        
        // PERBAIKAN UTAMA: Filter semua baris (row) milik mahasiswa ini, bukan cuma baris pertama
        const mhsRows = semuaNilai.filter(row => 
            row['Nama Mahasiswa'] && row['Nama Mahasiswa'].toString().toLowerCase().includes(namaInput)
        );

        if (mhsRows.length === 0) {
            setStatus(`❌ Mahasiswa bernama '${document.getElementById('searchInput').value}' tidak ditemukan.`, "error");
            document.getElementById('khsHeader').style.display = 'none';
            document.getElementById('khsTable').style.display = 'none';
            document.getElementById('printBtn').style.display = 'none';
            return;
        }

        // GABUNGKAN SEMUA BARIS: Satukan nilai dari Semester 1, 2, 3, dst ke dalam satu data utuh
        let mhsData = {};
        mhsRows.forEach(row => {
            for (const [key, value] of Object.entries(row)) {
                if (value !== null && value !== undefined && value !== '') {
                    mhsData[key] = value;
                }
            }
        });

        setStatus(""); 

        // Update Judul UI
        if (jenisCetak === 'all') {
            document.getElementById('judulDokumen').innerText = 'TRANSKRIP NILAI AKADEMIK';
            document.getElementById('lblSemester').innerText = 'Keseluruhan (Transkrip)';
            document.getElementById('lblIndeks').innerText = 'INDEKS PRESTASI KUMULATIF (IPK)';
        } else {
            document.getElementById('judulDokumen').innerText = `KARTU HASIL STUDI (KHS) - SMT ${jenisCetak}`;
            document.getElementById('lblSemester').innerText = jenisCetak;
            document.getElementById('lblIndeks').innerText = 'INDEKS PRESTASI SEMESTER (IPS)';
        }

        document.getElementById('khsHeader').style.display = 'block';
        document.getElementById('lblNama').innerText = mhsData['Nama Mahasiswa'];
        document.getElementById('lblTA').innerText = mhsData['TA'] || '2023/2024';
        
        // Penentuan Prodi berdasarkan dari mana data tersebut berasal
        const isASH = dataASH.find(r => r['Nama Mahasiswa'] && r['Nama Mahasiswa'].toString().toLowerCase().includes(namaInput));
        document.getElementById('lblProdi').innerText = isASH ? 'Ahwal Al-Syakhshiyyah (ASH)' : 'Pendidikan Bahasa Arab (PBA)';

        const tbody = document.getElementById('khsBody');
        tbody.innerHTML = '';
        document.getElementById('khsTable').style.display = 'table';
        document.getElementById('printBtn').style.display = 'block';

        let no = 1;
        let totalSKS = 0;
        let totalMutu = 0;

        for (const [mkName, mkValue] of Object.entries(mhsData)) {
            if (!isColumnExcluded(mkName) && mkValue !== null && mkValue !== '' && !isNaN(parseFloat(mkValue))) {
                
                const nilaiValid = parseFloat(mkValue);
                const normKey = normalizeMK(mkName); 
                
                let sks = 2; 
                let semesterMK = "0"; 
                
                if (dataKurikulum.length > 0) {
                    const matchMK = dataKurikulum.find(k => k['Mata Kuliah'] && normalizeMK(k['Mata Kuliah']) === normKey);
                    
                    if (matchMK) {
                        if (matchMK['SKS']) sks = parseInt(matchMK['SKS']);
                        if (matchMK['Semester']) semesterMK = matchMK['Semester'].toString();
                    }
                }

                // Logika Filter Semester
                if (jenisCetak !== 'all' && semesterMK !== jenisCetak) {
                    continue; 
                }

                const { huruf, bobot } = konversiNilai(nilaiValid);
                const mutu = sks * bobot;

                totalSKS += sks;
                totalMutu += mutu;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${no++}</td>
                    <td>${mkName.trim()}</td>
                    <td style="text-align: center;">${sks}</td>
                    <td style="text-align: center;">${nilaiValid.toFixed(2)}</td>
                    <td style="text-align: center; font-weight:bold; color: ${huruf === 'E' || huruf === 'D' ? 'red' : 'black'};">${huruf}</td>
                    <td style="text-align: center;">${mutu.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        if (no === 1) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="6" style="text-align: center; font-style: italic; color: #7f8c8d;">Data nilai untuk semester ini tidak ditemukan atau belum diinput.</td>`;
            tbody.appendChild(tr);
        }

        const ips = totalSKS > 0 ? (totalMutu / totalSKS).toFixed(2) : '0.00';
        document.getElementById('totSks').innerText = totalSKS;
        document.getElementById('totMutu').innerText = totalMutu.toFixed(2);
        document.getElementById('ips').innerText = ips;
    }

    window.onload = () => {
        initData();
    };
</script>

</body>
</html>
